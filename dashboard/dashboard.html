<style>
/* The system San Francisco stack (ADR 0013): nothing to load, nothing from elsewhere. */
:root{
  --bg:#ffffff; --side:#f7f7f8; --raise:#ffffff; --card:#ffffff; --colbg:#f6f6f7; --band:#f6f6f7; --hover:#f3f3f4; --press:#ececee;
  --line:#ececee; --line2:#dcdce0;
  --fg:#18181b; --fg2:#3f3f46; --mute:#6b6b74; --faint:#93939c;
  --act:#d9480f; --on-act:#ffffff; --act-bg:#fff5ee; --act-line:#f8cfb4; --act-fg:#b93d0b;
  --ok:#2b9a59; --fail:#d43d3d; --add:#1f8a4c; --del:#c63a3a;
  --shadow:0 8px 40px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.06);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1011; --side:#0a0a0b; --raise:#131415; --card:#1a1b1e; --colbg:#141516; --band:#151617; --hover:#191a1c; --press:#202124;
  --line:#212225; --line2:#2f3035;
  --fg:#ededf0; --fg2:#c8c8ce; --mute:#8e8f97; --faint:#63646c;
  --act:#ff8a3d; --on-act:#1b0d03; --act-bg:#24170f; --act-line:#4f321f; --act-fg:#ff9a57;
  --ok:#4cc38a; --fail:#f2686b; --add:#4cc38a; --del:#f2686b;
  --shadow:0 8px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1011; --side:#0a0a0b; --raise:#131415; --card:#1a1b1e; --colbg:#141516; --band:#151617; --hover:#191a1c; --press:#202124;
  --line:#212225; --line2:#2f3035;
  --fg:#ededf0; --fg2:#c8c8ce; --mute:#8e8f97; --faint:#63646c;
  --act:#ff8a3d; --on-act:#1b0d03; --act-bg:#24170f; --act-line:#4f321f; --act-fg:#ff9a57;
  --ok:#4cc38a; --fail:#f2686b; --add:#4cc38a; --del:#f2686b;
  --shadow:0 8px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--side);color:var(--fg);font:13.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:1px;border-radius:6px}
.mono{font-family:var(--mono);font-size:12px;font-feature-settings:"zero" 0}
.num{font-variant-numeric:tabular-nums}
svg{flex:none;display:block}
kbd{font:500 11px var(--sans);color:var(--mute);border:1px solid var(--line2);border-radius:4px;padding:0 4px;min-width:18px;text-align:center;display:inline-block;line-height:16px}

.app{display:flex;height:100vh;height:100dvh}

/* ── sidebar ── */
.side{width:216px;flex:none;padding:12px 10px;display:flex;flex-direction:column;gap:1px}
.ws{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;font-weight:600;letter-spacing:-.01em}
.logo{width:22px;height:22px;flex:none;background:var(--logo) center/contain no-repeat}
.nav{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;color:var(--mute);width:100%;text-align:left;transition:background .12s}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav.on{background:var(--press);color:var(--fg);font-weight:500}
.nav.subn{padding-left:16px}
.nav .c{margin-left:auto;font-size:12px;color:var(--faint)}
.nav .c.act{color:var(--act-fg);font-weight:600}
.side .lbl{font-size:12px;color:var(--faint);padding:18px 8px 6px}
.side .foot{margin-top:auto;padding:8px;color:var(--faint);font-size:12px;display:flex;flex-direction:column;gap:8px}
.side .keys{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center}

/* ── main ── */
.main{flex:1;min-width:0;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;container:main/inline-size}
.top{display:flex;align-items:center;gap:10px;height:48px;flex:none;padding:0 16px 0 20px;border-bottom:1px solid var(--line)}
.top h2{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.top .mlogo{display:none}
.sumline{color:var(--mute);display:flex;gap:6px;align-items:center;white-space:nowrap;min-width:0;overflow:hidden}
.sumline b{font-weight:500;color:var(--fg)}
.sumline .a{color:var(--act-fg);font-weight:600}
.sumline i{font-style:normal;color:var(--faint)}
.top .sp{flex:1}
.top .cost{color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:7px;padding:0 10px;height:28px;font-size:13px;font-weight:500;background:var(--raise);white-space:nowrap;transition:background .12s,transform .08s}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.pri:hover{opacity:.88}
.btn.act{background:var(--act);border-color:var(--act);color:var(--on-act);font-weight:600}
.btn.act:hover{filter:brightness(1.07);background:var(--act)}
.btn.ghost{border-color:transparent;background:none;color:var(--mute)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.sm{height:24px;padding:0 8px;font-size:12.5px;border-radius:6px}
.btn.sel{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ib{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--mute);transition:background .12s,color .12s}
.ib:hover{background:var(--press);color:var(--fg)}

.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.ghead{display:flex;align-items:center;gap:8px;height:36px;padding:0 20px;background:var(--band);font-weight:500;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
.ghead .n{color:var(--faint);font-weight:400}
.ghead.act{background:var(--act-bg);color:var(--act-fg);border-bottom-color:var(--act-line)}
.ghead.act .n{color:var(--act-fg);opacity:.7}
.ghead .hint{margin-left:auto;color:var(--faint);font-weight:400;font-size:12px}
.empty{padding:14px 20px 14px 50px;color:var(--faint)}

.rw{border-bottom:1px solid var(--line);position:relative}
.rw.you::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--act)}
.row{display:grid;grid-template-columns:18px 42px minmax(0,1fr) auto 108px 76px 28px;column-gap:12px;align-items:center;padding:11px 16px 11px 20px;cursor:default;outline-offset:-2px;transition:background .12s}
.row:hover{background:var(--hover)}
.rw.sel .row{background:var(--hover)}
.rw.open .row{background:var(--press)}
.row .ic{grid-column:1} .row .id{grid-column:2;color:var(--faint)} .row .mn{grid-column:3;min-width:0}
.row .chg{grid-column:4} .row .trk,.row .rep{grid-column:5} .row .fin{grid-column:4/6} .row .tm{grid-column:6;text-align:right;color:var(--mute)} .row .acts{grid-column:7}
.row .rep{justify-self:end}
.row .fin{justify-self:end;color:var(--mute);white-space:nowrap;font-size:12.5px}
.row .fin.new{color:var(--ok);font-weight:500}
.ttl{font-size:14px;font-weight:500;letter-spacing:-.006em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .idn{display:none;color:var(--faint);margin-right:6px;font-weight:400}
.rw.end .ttl{font-weight:400}
.rw.gone .ttl{color:var(--faint)}
.rw.end .acts{opacity:0;transition:opacity .12s}
.rw.end .row:hover .acts,.rw.end .row:focus-within .acts,.rw.end.sel .acts{opacity:1}
.tag{font:400 11px var(--sans);border:1px solid var(--line2);border-radius:10px;padding:0 6px;color:var(--faint);margin-left:8px;vertical-align:1px}
.sub{margin-top:3px;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.sub.q{color:var(--fg2);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub .stg{color:var(--fg);font-weight:500}
.sub .rd{color:var(--faint);margin-left:5px}
.sub .dot{color:var(--faint);margin:0 6px}
.sub .vb{color:var(--fg2);margin-right:5px}
.sub .res{color:var(--ok)} .sub .bad{color:var(--fail)}
.df{font-family:var(--mono);font-size:11.5px;margin-left:6px;white-space:nowrap}
.df .a{color:var(--add)} .df .d{color:var(--del)}
.chg{font-size:12px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:2px}
.chg.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:translateY(3px);opacity:.4}}

/* shimmer on the call that is running right now */
.shim{background:linear-gradient(90deg,var(--mute) 0%,var(--mute) 35%,var(--fg) 50%,var(--mute) 65%,var(--mute) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-100% 0}}
.caret::after{content:"";display:inline-block;width:6px;height:12px;margin-left:2px;vertical-align:-1px;background:var(--fg);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* stage track */
.trk{display:flex;gap:3px;align-items:center}
.seg{flex:1;height:4px;border-radius:2px;background:var(--line2);position:relative;overflow:hidden}
.seg.ok{background:var(--mute)}
.seg.you{background:var(--act)}
.seg.skip{background:var(--line2)}
.seg.paused{background:var(--fg)}
.seg.run{background:var(--line2)}
.seg.run::after{content:"";position:absolute;inset:0;background:var(--fg);border-radius:2px;animation:sweep 1.4s var(--ease) infinite}
@keyframes sweep{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.seg.just{animation:fill .5s var(--ease)}
@keyframes fill{from{transform:scaleX(0);transform-origin:left;background:var(--fg)}to{transform:scaleX(1);transform-origin:left}}
.spin{animation:rot 1.1s linear infinite;transform-origin:8px 8px}
@keyframes rot{to{transform:rotate(360deg)}}
.rw.flash .row{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--press)}}

/* view switch */
.segc{display:flex;background:var(--band);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex:none}
.segc button{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--mute);transition:background .12s,color .12s}
.segc button:hover{color:var(--fg)}
.segc button.on{background:var(--raise);color:var(--fg);box-shadow:0 0 0 1px var(--line2)}

/* board (ADR 0013, dashboard/mockups/board-apple.html): lanes are quiet surfaces, cards carry the type hierarchy */
.scroll.bd{display:flex;flex-direction:column}
.scroll.bd #list{flex:1 0 auto;display:flex;flex-direction:column}
.board{--ring:color-mix(in srgb,var(--fg) 9%,transparent);flex:1;display:flex;gap:12px;padding:16px 20px 8px;align-items:stretch;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.col{flex:1 0 204px;max-width:340px;min-width:0;background:var(--colbg);border-radius:14px;padding:6px;display:flex;flex-direction:column;min-height:180px}
.chead{display:flex;align-items:baseline;gap:7px;padding:10px 12px 10px;white-space:nowrap}
.chead .nm{font-size:13px;font-weight:600;letter-spacing:-.01em}
.chead .n{font-size:13px;color:var(--faint)}
.chead .who{margin-left:auto;font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;min-width:0}
.chead .dot{width:7px;height:7px;border-radius:4px;align-self:center;flex:none}
.col.ny .dot{background:var(--act)} .col.ready .dot{background:var(--ok)}
.col.ny:not(.nil) .nm,.col.ny:not(.nil) .n{color:var(--act-fg)}
.col.nil:not(.ny){flex:0 0 44px;padding:6px 0;align-items:center}
.col.nil:not(.ny) .chead{writing-mode:vertical-rl;padding:12px 0;gap:8px;color:var(--mute)}
.col.nil:not(.ny) .chead .nm{font-weight:500}
.col.nil:not(.ny) .chead .who,.col.nil:not(.ny) .dot{display:none}
.cards{display:flex;flex-direction:column;gap:8px;flex:1}
.cards .nilt{font-size:12.5px;color:var(--faint);padding:2px 12px}

.rw.card{border:0;border-radius:10px;background:var(--card);padding:11px 12px 9px;display:flex;flex-direction:column;gap:7px;cursor:default;min-width:0;box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s;outline-offset:2px}
.rw.card:hover,.rw.card.sel{box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 16%,transparent),0 4px 14px rgba(0,0,0,.07)}
.rw.card.rdy{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ok) 55%,transparent),0 1px 2px rgba(0,0,0,.04)}
.rw.card.ny{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--act) 60%,transparent),0 1px 2px rgba(0,0,0,.04)}
.rw.card.open{box-shadow:0 0 0 2px var(--fg)}
.rw.card.flash{animation:cflash 1.4s ease-out}
@keyframes cflash{0%{box-shadow:0 0 0 4px color-mix(in srgb,var(--fg) 20%,transparent)}}
.ctop{display:flex;align-items:center;gap:7px;min-width:0;height:16px;font:400 11px var(--mono);color:var(--faint)}
.ctop .id{font-weight:500;color:var(--mute);flex:none}
.ctop .rnd{font:400 11px var(--sans);color:var(--mute)}
.ctop .sp{flex:1}
.ctop .mt{white-space:nowrap;flex:none}
.ctop .mt i{font:400 11px var(--sans);font-style:normal}
.pulse{width:6px;height:6px;border-radius:3px;background:var(--fg2);flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.ctt{font-size:13.5px;font-weight:600;line-height:1.36;letter-spacing:-.012em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.card.gone .ctt{color:var(--mute);font-weight:500}
.prow{display:flex;align-items:flex-start;gap:8px}
.prow .cst{margin-left:auto;font:400 11px/18px var(--mono);color:var(--mute);flex:none}
.pills{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.pl{font:500 11px/18px var(--sans);padding:0 7px;border-radius:6px;background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--mute);white-space:nowrap}
.pl.high{color:var(--fg);font-weight:600}
.pl.pass{background:color-mix(in srgb,var(--ok) 13%,transparent);color:color-mix(in srgb,var(--ok) 78%,var(--fg))}
.pl.fail{background:color-mix(in srgb,var(--fail) 12%,transparent);color:color-mix(in srgb,var(--fail) 82%,var(--fg))}
.cbot{display:flex;align-items:flex-start;gap:8px;min-width:0;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.evl{flex:1;min-width:0;font:400 12px/16px var(--sans);color:var(--mute);height:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
.card.end .evl{height:auto}
.evl .vb{font-weight:500;color:var(--fg2);margin-right:1px}
.evl .tg,.evl .df{font-family:var(--mono);font-size:11px}
.evl .tg{color:var(--fg2)}
.evl .df{margin-left:5px}
.evl .ok{color:color-mix(in srgb,var(--ok) 78%,var(--fg));font-weight:500}
.evl .bad{color:color-mix(in srgb,var(--fail) 82%,var(--fg));font-weight:500}
.cbot .ib{width:22px;height:22px;border-radius:6px;margin:-3px -4px -3px 0;color:var(--faint);flex:none}
.cq{font-size:12.5px;line-height:1.45;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.ny .btn.act{height:26px;font-size:12.5px;padding:0 13px;border-radius:8px;align-self:flex-start;margin:1px 0 2px}
.card.ny .tka{flex-wrap:wrap;margin:1px 0 2px}
button.a{font-weight:600}button.a:hover{text-decoration:underline;text-underline-offset:3px}

/* inline composer under a row */
.inl{padding:2px 16px 14px 92px;animation:drop .22s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}

/* ── composer (one component: reply, steer, follow up) ── */
.cmp{display:flex;flex-direction:column;gap:8px;max-width:680px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:14px;padding:2px 10px;font-size:12.5px;color:var(--fg2);background:var(--raise);transition:background .12s}
.chip:hover{background:var(--hover)}
.cmp:has(textarea:not(:placeholder-shown)) .chips{display:none}
.choice{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.choice b{font-weight:500;min-width:84px;font-size:12.5px;color:var(--fg2)}
.box{border:1px solid var(--line2);border-radius:10px;background:var(--raise);transition:border-color .12s,box-shadow .12s}
.box:focus-within{border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 10%,transparent)}
.cmp.you .box{border-color:var(--act-line)}
.cmp.you .box:focus-within{border-color:var(--act);box-shadow:0 0 0 3px color-mix(in srgb,var(--act) 16%,transparent)}
.box textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;padding:10px 12px 4px;min-height:38px;max-height:160px;line-height:1.45}
.box textarea::placeholder{color:var(--faint)}
.cbar{display:flex;align-items:center;gap:4px;padding:4px 6px 6px 12px}
.cbar .hint{font-size:12px;color:var(--faint);line-height:1.35;min-width:0;flex:1 1 140px}
.cbar .tka,.cbar .btn{flex:none}
.cbar .sp{flex:1}
.send{width:26px;height:26px;border-radius:13px;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin-left:4px;transition:transform .08s,opacity .12s;flex:none}
.cmp.you .send{background:var(--act);color:var(--on-act)}
.send:active{transform:scale(.9)}
.cmp:has(textarea:placeholder-shown):not(.ready) .send{opacity:.35}
.cmp.nope .box{animation:nope .3s}
/* a done job: its report and branch, and an explicit way to reopen it (never a stray message) */
.fin .cbar{gap:8px;padding:8px;flex-wrap:wrap}
.br{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 100%}
.br i{font-style:normal;font-size:12px;color:var(--faint);flex:none}
.br code{font:12px var(--mono);color:var(--fg2);background:var(--band);border:1px solid var(--line);border-radius:6px;padding:2px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.br .ib{width:26px;height:26px}
a.btn{text-decoration:none}
@keyframes nope{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* ── panel ── */
.panel{width:0;flex:none;overflow:hidden;transition:width .28s var(--ease);background:var(--raise)}
.panel.on{width:520px;border-left:1px solid var(--line)}
.pin{width:520px;height:100%;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:8px;height:48px;flex:none;padding:0 10px 0 20px;border-bottom:1px solid var(--line);color:var(--mute)}
.ph .sp{flex:1}
.ph .back{display:none}
.pscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 20px 16px}
.pscroll h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 10px;line-height:1.25;text-wrap:balance}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:13px}
.meta .st{display:inline-flex;gap:7px;align-items:center;color:var(--fg);font-weight:500}
.meta .st.you{color:var(--act-fg)}
.meta a{color:var(--fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ptrk{margin:18px 0 4px}
.ptrk .trk{gap:4px}
.ptrk .lbls{display:flex;gap:4px;margin-top:7px}
.ptrk .lbls span{flex:1;font-size:11.5px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptrk .lbls .cur{color:var(--fg);font-weight:500}
.ptrk .lbls .cur.you{color:var(--act-fg)}
.tabs{display:flex;gap:2px;margin:18px -8px 4px;position:sticky;top:-20px;background:var(--raise);z-index:1;padding:6px 0;border-bottom:1px solid var(--line)}
.tab{padding:4px 9px;border-radius:6px;color:var(--mute);font-weight:500;font-size:13px}
.tab:hover{background:var(--hover)}
.tab.on{color:var(--fg);background:var(--press)}
.tab .n{color:var(--faint);font-weight:400;margin-left:5px}

/* timeline */
.sg{display:grid;grid-template-columns:16px auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 0;cursor:default}
.sg.exp{cursor:pointer}
.sg b{font-weight:500}
.sg .who{color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .du{color:var(--faint);font-size:11.5px}
.sgsum{margin:-5px 0 6px 26px;color:var(--mute);font-size:12.5px}
.tkt{margin:-4px 0 12px;color:var(--mute);font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:9em;overflow:auto}
.sgsum.bad{color:var(--fail)}
.sgsk{margin:-5px 0 6px 26px;display:flex;flex-wrap:wrap;gap:4px}
.sgsk span{font-size:10.5px;line-height:16px;padding:0 6px;border-radius:999px;border:1px solid var(--line2);color:var(--faint)}
.evs{margin:0 0 6px 7.5px;padding:2px 0 2px 18px;border-left:1px solid var(--line2);display:flex;flex-direction:column;gap:7px}
.ev{font-size:13px;min-width:0}
.ev.in{animation:evin .28s var(--ease)}
@keyframes evin{from{opacity:0;transform:translateY(6px)}}
.ev.think{color:var(--mute)}
.ev.tool{display:flex;gap:8px;align-items:baseline}
.ev.tool .vb{font-size:11.5px;font-weight:500;color:var(--mute);border:1px solid var(--line);background:var(--band);border-radius:5px;padding:0 5px;flex:none;line-height:18px}
.ev.tool .tg{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;min-width:0}
.ev.tool .du{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);flex:none;padding-left:8px}
.ev.tool.live .du{color:var(--fg)}
.ev.res,.ev.bad{display:flex;gap:7px;align-items:center;font-family:var(--mono);font-size:12px}
.ev.res{color:var(--ok)} .ev.bad{color:var(--fail)}
.ev.sys{color:var(--faint);font-size:12px}
.ev.agent,.ev.ask{padding:2px 0}
.ev .whoo{display:block;font-size:12px;color:var(--faint);margin-bottom:2px}
.ev.agent p,.ev.ask p{margin:0;color:var(--fg);line-height:1.5}
.ev.ask{border:1px solid var(--act-line);background:var(--act-bg);border-radius:10px;padding:10px 12px;margin:2px 0}
.ev.ask .whoo{color:var(--act-fg);font-weight:500}
.ev.you{align-self:flex-end;max-width:88%;display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin:4px 0}
.ev.you .bub{background:var(--press);border-radius:12px 12px 3px 12px;padding:7px 12px;line-height:1.45;overflow-wrap:anywhere}
.ev.you .ms{font-size:11.5px;color:var(--faint)}
.ev.you.in{animation:youin .3s var(--ease)}
@keyframes youin{from{opacity:0;transform:translateY(14px) scale(.97)}}

.crit{display:grid;grid-template-columns:16px 1fr;gap:3px 10px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.crit:first-child{border-top:0}
.crit svg{margin-top:2px}
.crit .e{grid-column:2;color:var(--mute);font-family:var(--mono);font-size:11.5px}
.file{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file .p{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;min-width:0;flex:1}
.none{color:var(--faint);padding:10px 0}
.pcmp{flex:none;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--raise)}
.pcmp .cmp{max-width:none}

/* toast + palette */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);transition:transform .3s var(--ease),opacity .3s;opacity:0;z-index:20;max-width:calc(100% - 32px);font-size:13px}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast button{border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);border-radius:6px;padding:2px 9px;font-weight:500;white-space:nowrap}
.pal{position:fixed;inset:0;z-index:30;display:none;background:color-mix(in srgb,#000 28%,transparent);padding:14vh 16px 0}
.pal.on{display:block}
.palbox{max-width:560px;margin:0 auto;background:var(--raise);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;animation:drop .18s var(--ease)}
.palbox input{width:100%;border:0;outline:0;background:none;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.pali{display:flex;gap:10px;align-items:center;padding:8px 12px;margin:4px;border-radius:7px;width:calc(100% - 8px);text-align:left}
.pali.on{background:var(--press)}
.pali span{color:var(--faint);margin-left:auto;font-size:12px;white-space:nowrap}
.pali em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pallist{max-height:320px;overflow-y:auto;padding:2px 0}
.foot2{padding:16px 20px 28px;color:var(--faint);font-size:12px;line-height:1.6}

::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(*){animation-duration:.34s;animation-timing-function:var(--ease)}
::view-transition-old(*){animation-duration:.1s}
::view-transition-new(*){animation-duration:.2s;animation-delay:.08s;animation-fill-mode:both}

/* ── list narrows (panel open, or a small window) ── */
@container main (max-width:900px){ .row .chg{display:none} }
/* board on a phone: lanes stack, Needs you first, empty lanes become one quiet line */
@container main (max-width:560px){
  .board{flex-direction:column;overflow:visible;padding:12px 12px 4px;gap:10px}
  .col,.col.nil:not(.ny){flex:none;max-width:none;min-height:0;align-items:stretch}
  .col.nil:not(.ny){background:none;padding:0 6px}
  .col.nil:not(.ny) .chead{writing-mode:horizontal-tb;padding:2px 10px;gap:7px}
  .col.nil:not(.ny) .chead .who{display:block}
  .evl{height:auto;min-height:16px}
}
@container main (max-width:780px){ .top .cost,.top .kb{display:none} }
/* the header keeps its counts on one line, by the main column's width (not the window's: the panel takes room):
   the view labels go first, then "ready", the title and New ticket's label, the queue count, then the words */
@container main (max-width:620px){ .segc span{display:none} }
@container main (max-width:520px){ #sum .rdy{display:none} }
@container main (max-width:480px){ .top{padding:0 12px 0 16px;gap:8px} .top h2,.top .pri .lg{display:none} }
@container main (max-width:420px){ #sum .qn{display:none} }
#sum .zero{display:none}
@container main (max-width:380px){ #sum .none{display:none} #sum .zero{display:inline} }
@container main (max-width:680px){
  .row{grid-template-columns:18px minmax(0,1fr) auto;row-gap:8px;padding:12px 12px 12px 16px;align-items:start}
  .row .id{display:none} .ttl .idn{display:inline}
  .row .ic{grid-column:1;grid-row:1;margin-top:2px} .row .mn{grid-column:2;grid-row:1} .row .tm{grid-column:3;grid-row:1}
  .row .trk{grid-column:2;grid-row:2;align-self:center} .row .acts{grid-column:3;grid-row:2;justify-self:end;margin:-6px -4px -6px 0}
  .row .rep{grid-column:2/4;grid-row:2;justify-self:start}
  .row .fin{grid-column:2;grid-row:2;justify-self:start}
  .ttl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rw.end .row{row-gap:2px}.rw.end .acts{display:none}
  .inl{padding:0 12px 14px 16px}
  .ghead{padding:0 16px}.ghead .hint{display:none}
  .empty{padding-left:46px}
}
@media (max-width:1080px){ .side{display:none} .top .mlogo{display:grid} }
@media (max-width:860px){
  .panel{position:fixed;inset:0;width:100%;transform:translateX(100%);transition:transform .28s var(--ease);z-index:10}
  .panel.on{width:100%;transform:none;border:0}
  .pin{width:100%}
  .ph{padding-left:8px} .ph .back{display:grid}
  .cbar .hint{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;flex:none}
  .pscroll{padding:16px 16px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .shim{color:var(--fg);background:none}
  .seg.run{background:var(--fg)}
  .pulse{opacity:1}
}

/* ── real data: Setup questions in the composer, links ── */
.choice.qa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start}
.choice.qa b{min-width:0;font-family:var(--mono);font-weight:400;color:var(--faint);padding-top:1px}
.choice.qa .qq{color:var(--fg);font-size:13px;line-height:1.45}
.choice.qa .qq i{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-top:2px}
.choice.qa .qbox{grid-column:2;border-color:var(--act-line)}
.choice.qa .qbox:focus-within{border-color:var(--act);box-shadow:0 0 0 3px color-mix(in srgb,var(--act) 16%,transparent)}
.qbox input{display:block;width:100%;border:0;outline:0;background:none;padding:7px 10px;line-height:1.45}
.qbox input::placeholder{color:var(--faint)}
.foot2 .mono{font-size:11.5px}
.row .tm{white-space:nowrap}
.tm i{font:400 12px var(--sans);font-style:normal;color:var(--faint)}
[data-tm] i{font-style:normal}
.rbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:9px 16px 9px 20px;border-bottom:1px solid var(--line);background:var(--band);color:var(--fg2);font-size:13px}
.rbar code{font:12px var(--mono);background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:1px 8px;color:var(--fg)}
.meta .age{color:var(--faint)}
.tka{display:inline-flex;gap:6px;flex:none;align-items:center}
/* A Needs-you row that waits on you: its one action sits under the reason, so the title and reason keep the row's width. */
.row .mn .tka{display:flex;margin-top:8px}
#sTk{text-align:right;line-height:1.3}
.tkbar>span{flex:1 1 260px}
.sub.q code,.ev.ask p code,.card .cq code,.card .evl code{font:11.5px var(--mono);background:var(--raise);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
@container main (max-width:680px){ .rbar{padding:9px 12px 9px 16px} }

<body>
<div class="app">
  <nav class="side" aria-label="Project">
    <div class="ws"><span class="logo" role="img" aria-label="Kitchen"></span><span id="wsName">kitchen</span></div>
    <button class="nav on" onclick="jump('g-you')"><span id="nJobI"></span>Jobs</button>
    <button class="nav subn" onclick="jump('g-you')"><span id="nYouI"></span>Needs you <span class="c act num" id="sYou"></span></button>
    <button class="nav subn" onclick="jump('g-run')"><span id="nRunI"></span><span id="sRunN">Running</span> <span class="c num" id="sRun"></span></button>
    <button class="nav subn" onclick="jump('g-done')"><span id="nDoneI"></span>Done <span class="c num" id="sDone"></span></button>
    <div class="lbl">Project</div>
    <button class="nav" onclick="openJob('setup')"><span id="nSetI"></span>Setup <span class="c" id="sSetup"></span></button>
    <button class="nav" onclick="openJob('setup')"><span id="nTkI"></span>Toolkit <span class="c" id="sTk"></span></button>
    <button class="nav" onclick="palette()"><span id="nCoI"></span>Cost <span class="c mono num" id="sCost"></span></button>
    <div class="foot">
      <div class="keys"><kbd>J</kbd><span>/ <kbd>K</kbd> move</span><kbd>R</kbd><span>message the agent</span><kbd>⌘K</kbd><span>commands</span></div>
      <button class="nav" style="margin:4px -8px -4px;width:auto" onclick="toggleTheme()"><span id="nThI"></span>Theme</button>
    </div>
  </nav>
  <main class="main">
    <div class="top">
      <span class="logo mlogo" role="img" aria-label="Kitchen"></span>
      <h2>Jobs</h2>
      <div class="sumline" id="sum"></div>
      <span class="sp"></span>
      <span class="cost mono num" id="tCost"></span>

<script>
/* Kitchen dashboard (ADR 0009, design: docs/mockups/dashboard-v4.html). Everything here is read from

   the same engine code as the kitchen CLI verbs. Nothing loads from elsewhere. */
const TOKEN=document.querySelector('meta[name="kitchen-token"]').content;
const LAUNCH=document.querySelector('meta[name="kitchen-launch"]').content;
/* reconnect:start (src/dashboard/server.test.ts runs this block) */
/* A tab left open from an earlier `kitchen dashboard` holds that launch's token. When the server says it
   restarted (another launch id, or a POST refused for its token), reload once; a second time in a row,
   say so and stop: never a reload loop. */
const RELOADED="kitchen-dashboard-reloaded";
function onRestart(store,reload,say){
  let tried=null;try{tried=store.getItem(RELOADED)}catch(e){tried="no storage"}
  if(tried){say("Couldn't reconnect; reload the page",true);return "stuck"}
  try{store.setItem(RELOADED,String(Date.now()))}catch(e){say("Couldn't reconnect; reload the page",true);return "stuck"}
  say("The dashboard restarted — reloading…",false);setTimeout(reload,700);return "reloading"
}
function onConnected(store){try{store.removeItem(RELOADED)}catch(e){}}
/* reconnect:end */
let restarting=false;
function restarted(){
  if(restarting)return;restarting=true;
  let store;try{store=window.sessionStorage}catch(e){store={getItem(){throw 0},setItem(){throw 0},removeItem(){}}}
  onRestart(store,()=>location.reload(),(m,stuck)=>{toast(m,stuck?"Reload":null,()=>location.reload());if(stuck)clearTimeout(toastT)});
}

S.rejected=S.skip; S.done=S.ok;

/* ───────── model ───────── */
let snap=null, setup=null, jobs=[], details={}, tick0=performance.now();
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const J=id=>jobs.find(j=>j.id===id);

const fmtL=s=>{s=Math.round(s);return s>=3600?Math.floor(s/3600)+"h "+String(Math.floor(s%3600/60)).padStart(2,"0")+"m":s>=60?Math.floor(s/60)+"m "+String(s%60).padStart(2,"0")+"s":s+"s"};
const hhmm=iso=>iso?new Date(iso).toTimeString().slice(0,8):"";
const num=id=>(/^(\d+)-/.exec(id)||[])[1]||id;
/* A job's own track (data.ts phasesFor: the Toolkit step shows once the smith ran for it), else the six. */
const steps=j=>j.kind==="setup"?(setup?setup.steps:[]):(j.phases||(snap?snap.phases:[]));
const sidx=j=>j.kind==="setup"?(setup?setup.idx:0):Math.max(0,steps(j).findIndex(s=>s.k===j.phase));
const stp=j=>steps(j)[sidx(j)]||{nm:""};
const stopped=j=>j.pausedBy==="stop";
/* you, run (working, paused or waiting) or done (finished, rejected, stopped by you): the List's sections and every count. */
const group=j=>j.state==="you"?"you":stopped(j)?"done":j.state==="run"||j.state==="paused"?"run":"done";
/* What the composer and the controls act on: a stopped job still takes a note and a Resume, like a paused one. */
const wgroup=j=>stopped(j)?"run":group(j);
const ended=j=>group(j)==="done";
const agent=j=>j.kind==="setup"?"the setup agent":j.agent?"the "+j.agent:"Kitchen";
const Agent=j=>{const a=agent(j);return a[0].toUpperCase()+a.slice(1)};
const secsOf=j=>j.secs0+(ended(j)?0:(performance.now()-j.at0)/1000);
const since=iso=>Math.max(0,(Date.now()-Date.parse(iso))/1000);
const short=s=>s<60?Math.floor(s)+"s":s<3600?Math.floor(s/60)+"m":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d";
/* Running: time in this stage. Needs you: how long it has waited. Paused: frozen at the time it ran before the pause. */
function timerHTML(j){if(j.kind==="setup")return clock(secsOf(j));if(j.state==="you")return `<i>waiting</i> ${short(since(j.movedAt))}`;if(j.state==="paused")return clock(j.pausedSecs||0);return clock(since(j.movedAt))}
function timerTitle(j){return j.state==="you"?"Waiting for you since "+hhmm(j.movedAt):j.state==="paused"?"Ran this long in the stage before it was paused":"Time in this stage"}
let view="list";try{view=localStorage.getItem("kitchen.view")==="board"?"board":"list"}catch(e){}
try{const t=localStorage.getItem("kitchen.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
let drafts={},answersDraft={},expanded=null,open=null,tab="activity",openSegs=new Set(),sel=null,fresh=new Set(),just=new Set(),pending={},sigs={},typing=new Map();

function fromSnap(c){
  const prev=J(c.id)||{};
  return {...c,kind:c.kind||"feature",num:num(c.id),cost:c.usd,secs0:c.secs,at0:performance.now(),
    state:c.state==="rejected"?"rejected":c.state,crit:freshCrit(c,prev)};
}
/* The Checks list from the panel's detail, only while it is from the job's current move: a detail fetched at an
   earlier stage (the panel was opened then closed) never stands in for the job as it is now. */
function freshCrit(c,prev){const d=details[c.id];
  if(d&&d.mv===c.movedAt)return d.crit;
  return prev.movedAt===c.movedAt&&prev.crit?prev.crit:[];
}
function fromSetup(s){
  /* quick: quick init ran and nothing failed; the Toolkit just isn't built (ADR 0010). It sits with the finished rows, not as a failure. */
  const st=s.state==="questions"?"you":s.state==="running"?"run":s.state==="done"||s.state==="quick"?"done":"rejected";
  return {id:"setup",num:"setup",kind:"setup",title:"Set up Kitchen for "+(snap?snap.repo:"this repo"),state:st,round:1,cost:s.usd,secs0:s.secs,at0:performance.now(),
    q:s.questions.length?s.questions.length===1?s.questions[0].question:`${s.questions.length} questions before I build the Toolkit.`:null,
    live:s.evs.at(-1)||null,files:[],crit:[],runnerOn:s.state==="running",failed:s.state==="failed",setup:s,lane:setupLane(s)};
}
/* Setup's steps (src/dashboard/setup.ts SETUP_STEPS) on the Board's lanes: config, branch, survey → Intake; build, commit → Build; prove it → Check. */
function setupLane(s){if(s.state==="questions")return "you";if(s.state!=="running")return "done";const k=(s.steps[s.idx]||{}).k;return k==="check"?"check":k==="build"||k==="commit"?"build":"intake"}

/* ───────── polling ───────── */
async function getJSON(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(u+": "+r.status);return r.json()}
let offline=false;
async function poll(){
  try{
    const [d,s]=await Promise.all([getJSON("/data.json"),getJSON("/setup.json")]);
    if(d.launch&&d.launch!==LAUNCH){restarted();return}
    try{onConnected(window.sessionStorage)}catch(e){}
    if(offline){offline=false;toast("Back in touch with Kitchen")}
    snap=d; setup=s;
    const before=new Map(jobs.map(j=>[j.id,j]));
    jobs=d.jobs.map(fromSnap); if(s.state!=="none")jobs.unshift(fromSetup(s));
    for(const j of jobs){const b=before.get(j.id);
      if(b&&!ended(b)&&ended(j)&&j.state==="done"){fresh.add(j.id);toast(j.kind==="setup"?"Setup is proven":`${j.num} is ready to merge`,"View",()=>openJob(j.id));setTimeout(()=>{fresh.delete(j.id);replaceRow(J(j.id))},20000)}
      if(b&&(b.phase!==j.phase||b.state!==j.state))just.add(j.id);
      if(b&&b.live&&j.live&&b.live.at===j.live.at&&b.live.t===j.live.t)j.liveShown=b.liveShown; else if(j.live&&b)startTyping(j);
    }
    paint(before);
  }catch(e){ if(!offline){offline=true;toast("Can't reach Kitchen's dashboard server. Retrying…")} }
  setTimeout(poll,jobs.some(j=>j.state==="run")?1500:3000);
}
async function pollDetail(){
  if(open&&open!=="setup"&&J(open)){
    try{const id=open,d=await getJSON(`/jobs/${encodeURIComponent(id)}/detail.json`);if(open===id){const old=details[id],j=J(id);d.mv=j?j.movedAt:null;details[id]=d;if(j)j.crit=d.crit;panelUpdate(old,d)}}catch(e){}
  }
  setTimeout(pollDetail,1500);
}
function sigOf(j){return [j.state,j.phase,j.stage,j.lane,j.round,j.q,j.pausedBy,j.title,j.report,j.files.length,j.runnerOn,j.movedAt,j.failed,j.risk,j.proof,j.waitYou,fresh.has(j.id),expanded===j.id].join("|")}
function paint(before){
  const order0=[...before.keys()].join(),order1=jobs.map(j=>j.id).join();
  const groups=j=>j?(view==="board"?j.lane:group(j)):"";
  const runner=!!(snap&&snap.runner.running),runnerChanged=paint.runner!==runner;paint.runner=runner; // the runner bar comes and goes with it
  const moved=runnerChanged||order0!==order1||jobs.some(j=>!before.has(j.id)||groups(before.get(j.id))!==groups(j));
  if(moved){structural(()=>{});}
  else{
    let openChanged=false;
    for(const j of jobs){const s=sigOf(j);if(sigs[j.id]!==s){if(j.id===open)openChanged=true;replaceRow(j);sigs[j.id]=s}else patchLive(j)}
    renderCounts();
    const ss=setup?[setup.state,setup.idx,setup.evs.length,setup.last.join()].join("|"):"";
    if(open&&J(open)&&((open==="setup"&&ss!==paint.setup)||(open!=="setup"&&(!details[open]||openChanged))))renderPanel(); else if(open&&open!=="setup")paintHead();
    paint.setup=ss;
  }
}

/* ───────── activity: typing + live timers ───────── */
function startTyping(j){ if(RM||!j.live){j.liveShown=1e9;return} j.liveShown=0; typing.set("lv:"+j.id,{j}) }
function evText(e){return e.c==="tool"?(e.tg||e.t):e.t}
const dfHTML=(a,d)=>`<span class="df num"><span class="a">+${a}</span> <span class="d">−${d}</span></span>`;
const liveOpen=e=>e&&e.c==="tool"&&e.dur==null;
const elapsed=at=>Math.max(0,(Date.now()-Date.parse(at))/1000);
function evHTML(e,uid,anim){

}
function liveHTML(j){
  if(j.kind==="setup"){const st=stp(j);let h=`<span class="stg">${esc(st.nm)}</span><span class="dot">·</span>`;
    if(j.failed)return h+`<span class="bad">Failed: ${esc((j.setup.last||[]).at(-1)||"see kitchen toolkit build --status")}</span>`;
    return h+liveEv(j)}

  if(j.state==="paused") return h+`<span>${j.pausedBy==="stop"?"Stopped by you":j.pausedBy?"Paused by you":"Waiting: "+esc(j.reason||j.paused||"")}</span>`;
  if(!j.runnerOn) return h+`<span>${snap&&snap.runner.running?"Waiting for a free slot":"Waiting for kitchen run"}</span>`;
  if(!j.agent&&!j.live) return h+`<span class="shim">${esc(j.step&&j.step.split(" · ").pop()||"Working")}</span>`;

function liveEv(j){

  if(e.c==="tool") return `<span class="vb">${esc(e.vb||e.t)}</span><span class="mono ${live?"shim":""}${car}" data-lv="${j.id}">${shown}</span>${e.df?dfHTML(...e.df):""}`;

}
function patchLive(j){const el=$("#lv-"+CSS.escape(j.id));if(el)el.innerHTML=view==="board"?evLine(j):liveHTML(j);const p=$("#pl-"+CSS.escape(j.id));if(p)p.innerHTML=pillsHTML(j);const c=$("#c-"+CSS.escape(j.id));if(c)c.textContent="$"+j.cost.toFixed(2)}

/* ───────── list ───────── */
function trackHTML(j){

    let c=j.kind==="setup"&&j.setup.state==="quick"?(k<i?"ok":""):j.state==="done"?"ok":k<i?"ok":k>i?"":j.state==="you"?"you":j.state==="paused"?"paused":j.state==="run"?(j.runnerOn?"run":"paused"):"skip";
    if(j.kind==="setup"&&j.failed&&k===i)c="you";

}
function chgHTML(j,bump){const A=j.files.reduce((a,f)=>a+f.a,0),D=j.files.reduce((a,f)=>a+f.d,0);
  return `<span class="chg${bump?" bump":""}" id="chg-${esc(j.id)}">${j.files.length&&group(j)==="run"?`${j.files.length} file${j.files.length>1?"s":""}${dfHTML(A,D)}`:""}</span>`}
const setupWaits=j=>j.kind==="setup"&&j.setup.toolkit==="waiting"&&j.state==="done";
function finLabel(j){if(j.kind==="setup"&&j.setup.state==="quick")return "Toolkit not built — kitchen toolkit build";if(setupWaits(j))return "Proven · waiting for your approval";if(stopped(j))return "Stopped by you";return j.state==="done"?(j.kind==="setup"?"Proven":"Ready to merge"):j.kind==="setup"?"Failed":"Rejected"}
/* A job paused no-toolkit (ADR 0010): build the Toolkit in a terminal, or resume (the resume rules decide whether it may go on without one). */
/* Kitchen's own messages name commands in backticks: shown as code. */
const md=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>");
/* Where the Toolkit stands (data.ts snapshot.toolkit, ADR 0015): waiting = proven, waiting for the person's approval. */

/* ───────── actions: every one a POST to the engine verb ───────── */
async function post(verb,body){
  try{
    const r=await fetch("/api/"+verb,{method:"POST",headers:{"content-type":"application/json","x-kitchen-token":TOKEN},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({ok:false,lines:["HTTP "+r.status]}));
    if(r.status===403&&(d.lines||[]).some(l=>/no token, or the wrong one/.test(l)))restarted();
    return {ok:r.ok&&d.ok,lines:d.lines||[]};
  }catch(e){return {ok:false,lines:["Kitchen's dashboard server is not answering"]}}
}
const said=lines=>(lines.at(-1)||"").replace(/^\S+\s\s/,"");

function clearDraft(id){drafts[id]="";$$(`textarea[data-draft="${id}"]`).forEach(o=>o.value="");grow()}
async function send(id){
  const j=J(id); if(!j)return; const text=(drafts[id]||"").trim(), g=wgroup(j);
  if(j.kind==="setup"){
    if(g!=="you")return;
    const answers={};for(const q of j.setup.questions)answers[q.id]=(answersDraft[q.id]||"")+(text&&q===j.setup.questions.at(-1)?(answersDraft[q.id]?" — ":"")+text:"");
    const r=await post("setup-answers",{answers});
    if(r.ok){answersDraft={};clearDraft(id);toast("Answers sent. Setup goes on")}else{nope(id);toast(said(r.lines)||"Not sent")}
    refreshSoon();return;
  }
  if(!text&&!(g==="you"&&j.stage==="needs-human")){nope(id);return}
  const verb=g==="you"?"answer":g==="done"?"follow-up":"steer";
  if(verb==="follow-up"&&!asking.has(id)){nope(id);return}
  clearDraft(id);
  const d=details[id];
  if(d&&open===id){const last=d.tl.at(-1);if(last){last.evs.push({c:"you",t:text,at:new Date().toISOString(),kind:verb,status:"Sending…"});if(tab==="activity")renderPanel()}}
  const r=await post(verb,verb==="follow-up"?{id:j.id,text,reopen:true}:{id:j.id,text});
  if(r.ok&&verb==="follow-up")asking.delete(id);
  if(!r.ok){drafts[id]=text;$$(`textarea[data-draft="${id}"]`).forEach(o=>o.value=text);grow();nope(id);toast(said(r.lines)||"Not sent")}
  else{if(open!==id){expanded=null;toast(verb==="steer"?`Sent to ${agent(j)} on ${j.num}`:verb==="answer"?`Answer sent to ${j.num}`:`${j.num} reopened for another round`,"View",()=>openJob(id))}}
  refreshSoon();
}
