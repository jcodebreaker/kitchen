<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen dashboard · Direction B · Tracks (mock-up)</title>
<!-- MOCK-UP. Direction B "Tracks": every job is a line on a transit map; stages are stations;
     a failed round loops back to Build on a new track. No remote fonts or scripts: the system
     Helvetica/Arial stack and inline SVG only, so this ships as-is under CSP default-src 'none'. -->
<style>
:root{
  --bg:#fff; --panel:#fff; --wash:#f2f2f0; --ink:#111; --ink2:#55585c; --ink3:#8d9094; --rule:#d9dadc; --rule2:#ececed; --sign:#111; --sign-ink:#fff;
  --fail:#e3170a; --you:#ffb000; --you-ink:#111; --ghost:#c9cbce;
  --l005:#0039a6; --l007:#ff6319; --l003:#00933c; --l006:#c60c6f; --l002:#996633; --l004:#f2b900; --l001:#8c8e91; --lsetup:#111;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#101112; --panel:#17181a; --wash:#1e2023; --ink:#f3f3f1; --ink2:#b3b6ba; --ink3:#7b7f84; --rule:#34373b; --rule2:#25272a; --sign:#000; --sign-ink:#fff;
  --fail:#ff4a3d; --you:#ffb000; --ghost:#44474b;
  --l005:#4f8dff; --l007:#ff7a3c; --l003:#2fc567; --l006:#ff4fa3; --l002:#c89461; --l004:#ffd21f; --l001:#7d8084; --lsetup:#f3f3f1; color-scheme:dark;}}
:root[data-theme=dark]{
  --bg:#101112; --panel:#17181a; --wash:#1e2023; --ink:#f3f3f1; --ink2:#b3b6ba; --ink3:#7b7f84; --rule:#34373b; --rule2:#25272a; --sign:#000; --sign-ink:#fff;
  --fail:#ff4a3d; --you:#ffb000; --ghost:#44474b;
  --l005:#4f8dff; --l007:#ff7a3c; --l003:#2fc567; --l006:#ff4fa3; --l002:#c89461; --l004:#ffd21f; --l001:#7d8084; --lsetup:#f3f3f1; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--you);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.86em}
code{background:var(--wash);padding:0 .3em;border-radius:3px}
.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.cap{font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.bullet{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font:700 13px/1 var(--sans);letter-spacing:-.02em;flex:none}
.bullet.dk{color:#111} .bullet.sm{width:24px;height:24px;font-size:10px}
.bullet.sq{border-radius:4px;font-size:10px;letter-spacing:.02em}
:root[data-theme=dark] .bullet.inv,.inv-auto{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bullet.inv{color:#111}}

.mock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:5px 20px;background:var(--you);color:#111;font-size:12px}
.mock span{flex:1;min-width:200px}
.mock button{border:1px solid #111;padding:1px 9px;font-size:11.5px;border-radius:3px}
.sign{background:var(--sign);color:var(--sign-ink);display:flex;align-items:center;gap:22px;padding:0 20px;border-top:3px solid var(--sign-ink);box-shadow:inset 0 3px 0 var(--sign)}
.sign h1{margin:0;font:700 26px/1 var(--sans);letter-spacing:-.03em;padding:15px 0 14px}
.sign .stat{font-size:13px;opacity:.85;line-height:1.25}
.sign .stat b{font-size:20px;letter-spacing:-.02em;display:block;opacity:1}
.sign .sp{flex:1}
.sign button{border:1px solid rgba(255,255,255,.5);padding:4px 10px;font-size:12px;border-radius:3px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px}
#mapwrap{overflow:auto;min-height:0;padding:0 20px 30px}
#insp{border-left:1px solid var(--rule);background:var(--panel);overflow:auto;min-height:0}

/* map */
.sec{display:flex;align-items:baseline;gap:12px;margin:22px 0 2px}
.sec h2{margin:0;font:700 19px/1 var(--sans);letter-spacing:-.02em}
.sec p{margin:0;color:var(--ink2);font-size:12.5px}
.stations{position:sticky;top:0;z-index:3;background:var(--bg);height:62px;border-bottom:2px solid var(--ink)}
.stations div{position:absolute;bottom:7px;transform:translateX(-50%);text-align:center;white-space:nowrap}
.stations b{display:block;font:700 12.5px/1.1 var(--sans);letter-spacing:-.01em}
.stations span{display:block;font:400 10px/1.25 var(--mono);color:var(--ink3)}
.stations b{margin-bottom:3px}
.trkw{position:relative}
.map{position:relative}
.guides{position:absolute;inset:0;pointer-events:none}
.guides i{position:absolute;top:0;bottom:0;border-left:1px dotted var(--rule)}
.line{position:relative;border-bottom:1px solid var(--rule2);--c:var(--ink)}
.line[aria-current=true]{background:var(--wash)}
.line svg{display:block;position:relative}
.lab{position:absolute;left:0;top:0;bottom:0;display:flex;gap:10px;align-items:flex-start;padding:10px 8px 0 4px;z-index:1}
.lab .t{font:700 14px/1.15 var(--sans);letter-spacing:-.01em;display:block}
.lab .m{font-size:11.5px;color:var(--ink2);display:block;margin-top:3px;line-height:1.3}
.trk{fill:none;stroke:var(--c);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ret{fill:none;stroke:var(--c);stroke-width:2.5;stroke-dasharray:1 6;stroke-linecap:round}
.ahead{stroke:var(--ghost);stroke-width:2;stroke-dasharray:2 5;fill:none}
.st{cursor:pointer}
.st .hit{fill:transparent}
.st .dot{fill:var(--bg);stroke:var(--c);stroke-width:3.5}
.st:hover .dot,.st[aria-current=true] .dot{stroke:var(--ink);stroke-width:4.5}
.st.fail .dot{fill:var(--fail);stroke:var(--fail)}
.st.fail text.g,.st.live text.g{fill:#fff;font:700 10px var(--sans);text-anchor:middle}
.st.live .dot{fill:var(--c)}
.st.live .ring{fill:none;stroke:var(--c);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(1.9);opacity:0}}
.st.wait rect{fill:var(--you);stroke:var(--ink);stroke-width:2}
.st.wait text.g{fill:#111;font:700 11px var(--sans);text-anchor:middle}
.st.past rect{fill:var(--bg);stroke:var(--you);stroke-width:2.5}
.st.term .dot{fill:var(--c)}
.st.end line{stroke:var(--c);stroke-width:6;stroke-linecap:round}
.st .cnt{font:700 9.5px var(--mono);fill:var(--ink2)}
.st .nt{font:400 10px var(--mono);fill:var(--ink3);text-anchor:middle}
.st .nb{font:700 11.5px var(--sans);fill:var(--ink);text-anchor:middle}
.gh{fill:var(--bg);stroke:var(--ghost);stroke-width:2}
.call{position:absolute;display:flex;align-items:center;gap:7px;max-width:46%;background:var(--ink);color:var(--bg);padding:3px 9px 3px 8px;border-radius:3px;font:500 11.5px/1.5 var(--mono);white-space:nowrap;pointer-events:none;z-index:2}
.call b{font-family:var(--sans);font-weight:700;flex:none}
.call span{overflow:hidden;text-overflow:ellipsis}
.call.r{transform:translateX(-100%)}
.call.you{background:var(--you);color:#111;pointer-events:auto;cursor:pointer;font-family:var(--sans);font-weight:700}
.call.flash span{animation:flash .6s ease-out}
@keyframes flash{from{opacity:.2}}
.record{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border-top:2px solid var(--ink)}
.record div{padding:10px 18px 0 0;margin-right:18px;border-right:1px solid var(--rule);font-size:12px;color:var(--ink2);line-height:1.3}
.record div:last-child{border:0}
.record b{font:700 18px/1.1 var(--sans);letter-spacing:-.02em;color:var(--ink);display:block}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:11.5px;color:var(--ink2);align-items:center}
.key svg{vertical-align:-4px;margin-right:5px}

/* inspector */
.ih{position:sticky;top:0;z-index:2;background:var(--sign);color:var(--sign-ink);padding:14px 18px 12px;border-top:3px solid var(--sign-ink);box-shadow:inset 0 3px 0 var(--sign);display:flex;gap:12px;align-items:flex-start}
.ih h2{margin:0;font:700 17px/1.15 var(--sans);letter-spacing:-.02em}
.ih p{margin:4px 0 0;font-size:12px;opacity:.8}
.ih .x{margin-left:auto;border:1px solid rgba(255,255,255,.5);border-radius:3px;padding:2px 8px;font-size:12px;flex:none}
.tabs{display:flex;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);z-index:1}
.tabs button{padding:10px 0 8px;margin-left:18px;font:700 12.5px/1 var(--sans);color:var(--ink3);border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.ip{padding:14px 18px 40px}
.ip h3{margin:18px 0 8px;font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between}
.ip h3:first-child{margin-top:0}
.card{border:1px solid var(--rule);border-radius:4px;padding:10px 12px;margin-bottom:8px;display:block;width:100%}
.card.you{border:2px solid var(--ink);border-left:10px solid var(--you)}
.card .hd{display:flex;gap:8px;align-items:center;font-weight:700}
.card .hd .num{margin-left:auto;font-weight:400;color:var(--ink2)}
.card p{margin:6px 0}
.card .q{font:700 15px/1.3 var(--sans);letter-spacing:-.01em}
.card .d{color:var(--ink2);font-size:12.5px}
.mini{font:400 11.5px/1.6 var(--mono);color:var(--ink2);margin-top:6px}
.mini div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini div:last-child{color:var(--ink);font-weight:600}
.mini b{color:var(--ink)}
textarea{width:100%;min-height:70px;font:400 13.5px/1.4 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--ink2);border-radius:3px;padding:8px}
.sug{display:block;font-size:12px;color:var(--ink2);margin:6px 0;text-decoration:underline dotted;text-underline-offset:3px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--ink);border-radius:3px;padding:6px 12px;font-weight:700;font-size:12.5px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sm{padding:2px 8px;font-size:11.5px}
.opt{display:block;border:1px solid var(--rule);border-radius:4px;padding:8px 10px;margin-top:6px;cursor:pointer}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt b{display:block;font-size:13px} .opt span{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.opt:has(input:checked){border:2px solid var(--ink);padding:7px 9px;background:var(--wash)}
.opt:has(input:checked) b::before{content:"● "}
.stop{border-left:6px solid var(--c);margin-left:9px;padding:0 0 12px 16px;position:relative}
.stop::before{content:"";position:absolute;left:-12px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:3px solid var(--c)}
.stop.fail::before,.stop.refused::before{background:var(--fail);border-color:var(--fail)}
.stop.live::before{background:var(--c)}
.stop.ask::before,.stop.you::before{border-radius:2px;border-color:var(--you);background:var(--you)}
.stop.sel{background:linear-gradient(90deg,var(--wash),transparent)}
.stop .h{display:flex;gap:8px;align-items:baseline;width:100%}
.stop .h b{font:700 13.5px/1.2 var(--sans)}
.stop .h .w{font:400 11px var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.stop .h .num{color:var(--ink2);white-space:nowrap}
.stop p{margin:3px 0 0;font-size:12.5px;color:var(--ink2)}
.stop.fail p,.stop.refused p{color:var(--fail)}
.lap{font:700 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:6px 0 10px;padding-top:10px;border-top:1px dashed var(--ink3);color:var(--ink2)}
.feed{font:400 11.5px/1.6 var(--mono);margin-top:6px;background:var(--wash);border-radius:3px;padding:6px 8px}
.ev{display:grid;grid-template-columns:54px minmax(0,1fr);gap:0 6px}
.ev b{color:var(--ink2);font-weight:700} .ev.tool b{color:var(--ink)} .ev span{overflow-wrap:anywhere} .ev i{font-style:normal;color:var(--ink3);margin-left:6px}
.ev.say span{font-family:var(--sans);font-size:12.5px} .ev.err span{color:var(--fail)}
.ev.new span{animation:flash .6s ease-out}
.crit{border-top:1px solid var(--rule);padding:10px 0}
.crit .hd{display:flex;gap:8px;align-items:center}
.crit .hd b{font-size:15px}
.pill{font:700 10.5px/1 var(--sans);letter-spacing:.06em;padding:4px 7px;border-radius:3px;border:1.5px solid var(--ink)}
.pill.PASS{background:var(--ink);color:var(--bg)} .pill.FAIL{background:var(--fail);border-color:var(--fail);color:#fff} .pill.run{border-style:dashed}
.crit .by{margin-left:auto;font-size:11.5px;color:var(--ink2)}
.crit p{margin:6px 0}
.kv{display:grid;grid-template-columns:48px minmax(0,1fr);gap:1px 8px;font:400 11px/1.55 var(--mono);color:var(--ink2);margin:0 0 6px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;overflow-wrap:anywhere}
.hist{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:3px}
.hist .why{flex-basis:100%;color:var(--fail)}
.chip{font:500 11px/1 var(--mono);border:1px solid var(--rule);border-radius:3px;padding:3px 6px}
.chip[aria-expanded=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.evd{border:1px solid var(--rule);border-radius:3px;margin-top:6px;overflow:hidden}
.evd header{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;font:500 11px/1.4 var(--mono);border-bottom:1px solid var(--rule2)}
.evd pre{margin:0;padding:8px;font:400 11px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto;background:var(--wash)}
.shot{padding:12px 8px;background:var(--wash)} .shot div{background:#f8ecc4;color:#3b2f06;border:1px solid #d9c27a;border-radius:6px;padding:8px 10px;font:500 12px/1.3 system-ui;white-space:nowrap;overflow:hidden} .shot small{display:block;margin-top:6px;color:var(--ink2)}
.find{border-top:1px solid var(--rule);padding:10px 0}
.find.dis{opacity:.5} .find.dis h4{text-decoration:line-through}
.find h4{margin:6px 0 4px;font:700 14px/1.25 var(--sans)}
.find p{margin:0 0 6px;font-size:12.5px;color:var(--ink2)}
.find .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:400 11px var(--mono);color:var(--ink2)}
.req{display:grid;grid-template-columns:28px 1fr;gap:4px 6px;margin:0;font-size:12.5px}
.req dt{font:700 11px/1.6 var(--mono)} .req dd{margin:0}
.fail{color:var(--fail)}
.scrim{display:none}

@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr) 380px}}
@media (max-width:860px){
  body{display:block;height:auto} .app{display:block} #mapwrap{overflow:visible;padding:0 14px 20px}
  #insp{border:0;border-top:2px solid var(--ink);overflow:visible}
  body.open #insp{position:fixed;inset:0;z-index:20;overflow:auto;border:0}
  .sign{gap:12px;padding:0 14px;flex-wrap:wrap} .sign h1{font-size:22px;padding:11px 0 10px} .sign .stat.h{display:none}
  .lab{position:static;padding:10px 0 0} .stations span{display:none} .stations{height:34px} .stations b{font-size:10px}
  .call.you{display:none} .st .nb{font-size:9px;font-weight:400} .sec{flex-direction:column;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mock"><b class="cap">Mock-up · Direction B · Tracks</b><span>Jobs 001–006 are real kitchen-dog data. The live activity, job 007 and the review findings on 003 are simulated examples and loop.</span><button id="pause">Pause</button><button id="restart">Restart</button></div>
<header class="sign">
  <h1>Kitchen</h1>
  <div class="stat" id="s-live"></div><div class="stat" id="s-you"></div><div class="stat h" id="s-ready"></div><div class="stat h" id="s-cost"></div>
  <div class="sp"></div><button id="theme">Dark</button>
</header>
<main class="app">
  <div id="mapwrap"><div id="map"></div></div>
  <aside id="insp" aria-label="Details"></aside>
</main>
<script>
// ───────────────────────────────────────────────────────────────────────────
// Mock-up model + simulation (shared by the three directions; inlined per file).
// Jobs 001–006 are the real kitchen-dog jobs (titles, criteria, agent runs, times,
// costs, verdict rows, the question on 006). Job 007 and the review findings on 003
// are invented examples, and "live" activity is a timer replaying a script.
// The real build would read job.json, the ledger, rounds/*, evidence/* and each
// agent run's session transcript (src/agents/claude.ts → transcriptPath).
// ───────────────────────────────────────────────────────────────────────────
const K = (() => {
  const STAGES = ["intake", "spec", "build", "gate", "drives", "verify", "review", "ready", "report", "done"];
  const LABEL = { intake: "Intake", spec: "Spec", repro: "Repro", build: "Build", gate: "Gate", drives: "Drives", verify: "Verify", toolkit: "Toolkit", review: "Review", ready: "Ready", report: "Report", done: "Done", "needs-info": "Needs info", "needs-human": "Needs you", rejected: "Rejected", you: "You" };
  // who works each stage by default (shown on headers); a run can override
  const WHO = {
    intake: { who: "intake", ad: "claude", m: "sonnet" }, spec: { who: "spec", ad: "claude", m: "opus" }, repro: { who: "verifier", ad: "claude", m: "sonnet" },
    build: { who: "builder", ad: "claude", m: "sonnet" }, gate: { eng: "typecheck · lint · tests" }, drives: { who: "verifier", ad: "claude", m: "sonnet" },
    verify: { eng: "runs every proof" }, review: { who: "reviewer", ad: "claude", m: "opus" }, ready: { eng: "sync base · publish" },
    report: { who: "report", ad: "claude", m: "sonnet" }, done: { eng: "" },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const code = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const dur = (s) => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`; };
  const usd = (n) => "$" + (n < 10 ? n.toFixed(2) : n.toFixed(1));
  const clock = (ms) => new Date(ms).toTimeString().slice(0, 8);

  // a(stage, round, secs, usd, line, extra) → agent run;  e(...) → engine run
  const a = (s, r, secs, usd, line, x = {}) => ({ s, r, secs, usd, line, res: "ok", ...WHO[s], ...x });
  const e = (s, r, secs, line, x = {}) => ({ s, r, secs, usd: 0, line, res: "ok", eng: WHO[s]?.eng || "engine", ...x });
  const T = (t, x, n) => ({ k: "tool", t, x, n });   // tool call
  const S = (x) => ({ k: "say", x });                // agent message
  const O = (x) => ({ k: "ok", x });                 // tool result
  const X = (x) => ({ k: "err", x });
  const Y = (x) => ({ k: "sys", x });                // engine line

  function seed() {
    const now = Date.now();
    const jobs = [
      { id: "005", slug: "005-kitchen-status-should-end-with-one-summa", short: "status summary line", title: "kitchen status should end with one summary line after the job rows",
        kind: "feature", risk: "low", stage: "build", round: 2, limit: 3, branch: "kitchen/005-kitchen-status-should-end-with-one-summa",
        ticket: "kitchen status should end with one summary line after the job rows: how many jobs, how many are done, and how many need a person (needs-info or needs-human), e.g. '4 jobs: 2 done, 1 needs you'. With no jobs it keeps printing 'no jobs' and no summary.",
        reqs: [["R1", "after the job rows, `kitchen status` prints one summary line"], ["R2", "the summary gives how many jobs there are"], ["R3", "the summary gives how many are done"], ["R4", "the summary gives how many need a person, worded like \"1 needs you\""], ["R5", "with no jobs, `kitchen status` keeps printing `no jobs`"], ["R6", "with no jobs, no summary line is printed", 1]],
        crit: [

<script>
const $ = (s, r = document) => r.querySelector(s);
const { esc, code, dur, usd, LABEL, STAGES } = K;

const drafts = {}, openStops = new Set(), cache = new WeakMap();
function patch(el, html) { if (cache.get(el) === html) return false; cache.set(el, html); el.innerHTML = html; return true; }
const pos = (s) => STAGES.indexOf(s === "repro" ? "spec" : s);

// geometry shared by the station header and every line

function lineOf(j) {

    const y = n * LH + 26, ps = [...l.st.keys()], from = n ? Math.min(...ps) : 0;
    let to = Math.max(...ps); const ex = l.extra.length ? X(l.extra.at(-1).at) + X.cw * 0.5 : 0;
    const done = j.stage === "done" && n === laps.length - 1;

    if (n < laps.length - 1) { const nx = Math.min(...laps[n + 1].st.keys()); svg += `<path class="ret" d="M${X(to)} ${y}a${LH / 4} ${LH / 4} 0 0 1 0 ${LH / 2}H${X(nx)}a${LH / 4} ${LH / 4} 0 0 0 0 ${LH / 2}"/>`; }
    for (const [p, runs] of l.st) {
      const last = runs.at(-1).r, isLive = runs.some((x) => x.r.live), bad = last.res === "fail" || last.res === "refused", cur = sel && sel.id === j.id && selRun != null && runs.some((x) => x.i === selRun);
      svg += `<g class="st ${isLive ? "live" : bad ? "fail" : ""}" data-st="${j.id}:${runs.at(-1).i}" tabindex="0" role="button" aria-current="${!!cur}" aria-label="${j.id} ${LABEL[STAGES[p]]} round ${l.round}: ${isLive ? "running now" : last.res}"><circle class="hit" cx="${X(p)}" cy="${y}" r="17"/>${isLive ? `<circle class="ring" cx="${X(p)}" cy="${y}" r="9"/>` : ""}<circle class="dot" cx="${X(p)}" cy="${y}" r="${bad || isLive ? 9 : 6.5}"/>${bad ? `<text class="g" x="${X(p)}" y="${y + 3.5}">✕</text>` : ""}${runs.length > 1 ? `<text class="cnt" x="${X(p) + 10}" y="${y - 9}">×${runs.length}</text>` : ""}</g>`;

function setupLine() {

function renderMap() {

function feed(evs, live) { return `<div class="feed">${evs.map((e, i) => `<div class="ev ${e.k} ${live && i === evs.length - 1 ? "new" : ""}"><b>${e.k === "tool" ? esc(e.t) : e.k === "say" ? "says" : e.k === "sys" ? "eng" : e.k === "ok" ? "└" : "✕"}</b><span>${e.k === "say" ? code(e.x) : esc(e.x)}${e.n ? `<i>${esc(e.n)}</i>` : ""}</span></div>`).join("")}</div>`; }
function askCard(j) {

}
function setupQs() {

}
function inspNow() {
  const need = K.state.jobs.filter(K.waiting), su = K.state.setup, sq = su.steps.find((s) => s.id === "questions").st === "ask", live = K.live();
  const sl = su.steps.find((s) => s.st === "live");
  return `<div class="ih"><div><h2>Service status</h2><p>What is moving, and what is held at a signal until you answer. Click a line or a station for its detail.</p></div></div><div class="ip">
    <h3><span>Held for you</span><span>${need.length + (sq ? su.questions.filter((q) => !q.a).length : 0)}</span></h3>${need.map(askCard).join("")}${sq ? setupQs() : ""}${!need.length && !sq ? '<p class="d" style="color:var(--ink2)">Nothing is waiting on you.</p>' : ""}

    ${live.map((j) => { const r = K.cur(j); return `<button class="card" data-job="${j.id}"><div class="hd"><span class="bullet sm ${j.id === "004" ? "dk" : ""}" style="--c:var(--l${j.id})">${j.id}</span>${LABEL[r.s]} · ${r.who ? `${r.who} · ${r.m}` : "engine"}<span class="num"><span data-t0="${r.t0}"></span></span></div><div class="mini">${r.ev.slice(-3).map((e) => `<div>${esc(K.evText(e))}</div>`).join("")}</div></button>`; }).join("")}</div>`;

}

  } else if (tab === "rev") {
    body = !rv ? `<p style="color:var(--ink2)">${j.stage === "done" ? "A low-risk job gets no review lenses: the criteria carried it." : "Review runs after verify passes. Risk decides the lenses: code, security, ux, ui."}</p>`
      : `<p style="margin:0 0 8px;color:var(--ink2);font-size:12.5px">Round ${rv.round}. A blocking finding sends the line back to Build. Dismiss one and it stops blocking.${rv.example ? " (Example findings.)" : ""}</p><div class="hist" style="margin-bottom:10px">${rv.lenses.map((l) => `<span class="pill ${l.st === "live" ? "run" : "PASS"}">${l.lens.toUpperCase()} · ${l.m}${l.st === "live" ? " · reading" : ""}</span>`).join("")}</div>` + rv.findings.map((f) => `<div class="find ${f.dismissed ? "dis" : ""}"><div class="l"><span class="pill ${f.blocks && !f.dismissed ? "FAIL" : ""}">${f.id} · ${f.dismissed ? "DISMISSED" : f.blocks ? "BLOCKING" : "NOTE"}</span><span>${f.lens} lens · ${f.conf} confidence</span><span>${esc(f.where)}</span></div><h4>${code(f.title)}</h4><p>${code(f.note)}</p><button class="btn sm" data-dis="${f.id}">${f.dismissed ? "Undo" : "Dismiss"}</button></div>`).join("");
  } else body = `<p style="font-size:15px;line-height:1.45;margin:0 0 14px">${esc(j.ticket)}</p><h3>Requirements from intake</h3><dl class="req">${j.reqs.map((r) => `<dt>${r[0]}</dt><dd>${code(r[1])}${r[2] ? ' <span class="mono" style="color:var(--ink3)">negative</span>' : ""}</dd>`).join("")}</dl><p class="mono" style="color:var(--ink2);margin-top:14px">${esc(j.branch)}</p>`;
  return `<div class="ih" style="--c:var(--l${j.id})"><span class="bullet ${j.id === "004" ? "dk" : ""}">${j.id}</span><div><h2>${esc(j.title)}</h2><p>${j.kind} · ${j.risk} risk · round ${j.round} of ${j.limit} · <span ${j.ended ? "" : `data-t0="${j.started}"`}>${dur(K.total(j))}</span> · ${usd(j.usd)}${j.report ? " · report.html ↗" : ""}${j.example ? " · example job" : ""}</p></div><button class="x" data-close>Close</button></div>
    <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${t}</button>`).join("")}</div><div class="ip" style="--c:var(--l${j.id})">${body}</div>`;
}
function inspSetup() {
  const su = K.state.setup, ask = su.steps.find((s) => s.id === "questions").st === "ask";
  return `<div class="ih" style="--c:#fff"><span class="bullet sq" style="color:#111">SET</span><div><h2>Setup · superchat-lite</h2><p>${esc(su.about)} ${usd(su.usd)} so far · branch kitchen/setup</p></div><button class="x" data-close>Close</button></div><div class="ip" style="--c:var(--lsetup)">
    ${ask ? `<h3>Held for you</h3>${setupQs()}<p style="font-size:12px;color:var(--ink2)">The Toolkit build leaves as soon as both are answered. Same as <code>kitchen init --answer …</code></p>` : ""}
    <h3>Stops</h3>${su.steps.map((s) => `<div class="stop ${s.st === "live" ? "live" : s.st === "ask" ? "ask" : ""}" style="${s.st === "wait" ? "opacity:.45" : ""}"><div class="h"><b>${esc(s.name)}</b><span class="w">${esc(s.by)}</span><span class="num" ${s.st === "live" ? `data-t0="${s.t0}"` : ""}>${s.secs ? dur(s.secs) : ""}</span><span class="num">${s.usd ? usd(s.usd) : ""}</span></div><p>${code(s.line)}</p>${s.ev && s.ev.length ? feed(s.st === "live" ? s.ev.slice(-8) : s.ev, s.st === "live") : ""}</div>`).join("")}
    <h3>What the survey found · 5 features</h3>${su.features.map((f, i) => `<div class="crit"><b>${esc(f[0])}</b><p style="color:var(--ink2);font-size:12.5px;margin:2px 0 0">${esc(f[1])}${i === 4 && su.questions[0].a === "engine" ? ' · <b class="fail">Toolkit gap with engine only</b>' : ""}</p></div>`).join("")}</div>`;
}
function renderInsp() {
  const el = $("#insp"), had = document.activeElement && document.activeElement.id === "ans";
  const html = !sel ? inspNow() : sel.t === "setup" ? inspSetup() : inspJob(K.job(sel.id));
  if (patch(el, html) && had) { const t = $("#ans"); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  document.body.classList.toggle("open", !!sel);
  fill();
}
function renderSign() {
  const h = K.health, su = K.state.setup;
  $("#s-live").innerHTML = `<b>${K.live().length + (su.steps.some((s) => s.st === "live") ? 1 : 0)}</b>moving`;
  $("#s-you").innerHTML = `<b style="color:var(--you)">${K.needs().length}</b>held for you`;
  $("#s-ready").innerHTML = `<b>${h.mergeReady} of ${h.takenIn}</b>merge-ready`;
  $("#s-cost").innerHTML = `<b>${usd(K.state.jobs.reduce((n, j) => n + j.usd, 0) + su.usd)}</b>spent today`;
}
function fill() { const now = Date.now(); document.querySelectorAll("[data-t0]").forEach((n) => { n.textContent = dur((now - +n.dataset.t0) / 1000); }); }
function all() { renderMap(); renderInsp(); renderSign(); }
function select(s, run) {
  sel = s; selRun = run ?? null; openEv = null;
  if (s && s.t === "job") { const j = K.job(s.id), r = run != null ? j.runs[run] : null; tab = r && r.s === "verify" && !r.live ? "crit" : r && r.s === "review" ? "rev" : "stops"; }
  all(); if (s) { $("#insp").scrollTop = 0; if (run != null && tab === "stops") $("#stop-" + run)?.scrollIntoView({ block: "center" }); }
}

K.on((type, p) => {
  if (type === "clock") return fill();
  if (type === "ev" || type === "setupev") {
    const id = type === "ev" ? p.j.id : "setup", c = document.querySelector(`[data-call="${id}"]`);
    if (c) { c.lastElementChild.textContent = K.evText(p.ev); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); }
    document.querySelectorAll(`[data-usd="${id}"]`).forEach((n) => { n.textContent = usd(p.j.usd); });
    if (!sel || (sel.t === "job" && sel.id === id) || (sel.t === "setup" && id === "setup")) renderInsp();
    return renderSign();
  }
  if (type === "reset" && sel && sel.t === "job" && !K.job(sel.id)) sel = null;
  all(); $("#pause").textContent = K.paused ? "Resume" : "Pause";
});
addEventListener("resize", () => { cache.delete($("#map")); renderMap(); });
document.addEventListener("input", (e) => { if (e.target.id === "ans") drafts[e.target.dataset.for] = e.target.value; });
document.addEventListener("change", (e) => { if (e.target.dataset.q) K.setupAnswer(e.target.dataset.q, e.target.value); });
function act(t) {
  const d = t.dataset, j = sel && sel.t === "job" ? K.job(sel.id) : null;
  if (t.id === "pause") K.paused = !K.paused;
  else if (t.id === "restart") { K.paused = false; K.reset(); }
  else if (t.id === "theme") { const dark = getComputedStyle(document.documentElement).colorScheme === "dark"; document.documentElement.dataset.theme = dark ? "light" : "dark"; t.textContent = dark ? "Dark" : "Light"; }
  else if (d.st) { const [id, i] = d.st.split(":"); select({ t: "job", id }, +i); }
  else if ("setup" in d) select({ t: "setup" });
  else if (d.sug) { drafts[d.sug] = K.job(d.sug).ask.suggest[0]; cache.delete($("#insp")); renderInsp(); $("#ans").focus(); }
  else if (d.send) { const v = (drafts[d.send] || "").trim(); if (!v) return $("#ans").focus(); K.answer(d.send, v); delete drafts[d.send]; select({ t: "job", id: d.send }); }
  else if (d.reject) K.reject(d.reject);
  else if (d.job) select({ t: "job", id: d.job });
  else if ("close" in d) select(null);
  else if (d.tab) { tab = d.tab; renderInsp(); }
  else if (d.stop) { const k = j.id + ":" + d.stop; if (selRun === +d.stop) selRun = null; else openStops.has(k) ? openStops.delete(k) : openStops.add(k); renderInsp(); }
  else if (d.ev) { openEv = openEv === d.ev ? null : d.ev; renderInsp(); }
  else if (d.dis) { const f = j.review.findings.find((x) => x.id === d.dis); K.dismiss(j.id, d.dis, !f.dismissed); }
}
document.addEventListener("click", (e) => { const t = e.target.closest("button,[data-st],[data-setup],[data-job]"); if (t) act(t); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && sel) select(null);
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g[role=button]")) { e.preventDefault(); act(e.target); }
});
if (getComputedStyle(document.documentElement).colorScheme === "dark") $("#theme").textContent = "Light";
all();
</script>
</body>
</html>
