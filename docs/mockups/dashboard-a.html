<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen dashboard · Direction A · Docket (mock-up)</title>
<!-- MOCK-UP. Direction A "Docket": an inbox of jobs, a run sheet, and a proof column.
     Fonts: Archivo (variable width) + JetBrains Mono from Google Fonts for the mock-up only.
     The real dashboard is served with CSP default-src 'none', so the build would ship the two
     woff2 files from its own origin (font-src 'self') or fall back to the system stack below. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff; --wash:#f3f3f1; --ink:#0a0a0a; --ink2:#4d4e52; --ink3:#8a8b90; --line:rgba(10,10,10,.16); --line2:rgba(10,10,10,.08);
  --hl:#e2ff3b; --you:#ffa3d1; --mark:#0a0a0a; --bad:#d42a12; --shadow:0 18px 50px rgba(0,0,0,.14);
  --sans:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0c0c0d; --wash:#17171a; --ink:#f2f2ed; --ink2:#b4b5ba; --ink3:#77787e; --line:rgba(255,255,255,.2); --line2:rgba(255,255,255,.09);
  --hl:#dcff2e; --you:#ff94c8; --mark:#0a0a0a; --bad:#ff5b40; --shadow:0 18px 50px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme=dark]{
  --paper:#0c0c0d; --wash:#17171a; --ink:#f2f2ed; --ink2:#b4b5ba; --ink3:#77787e; --line:rgba(255,255,255,.2); --line2:rgba(255,255,255,.09);
  --hl:#dcff2e; --you:#ff94c8; --mark:#0a0a0a; --bad:#ff5b40; --shadow:0 18px 50px rgba(0,0,0,.6); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--sans);font-stretch:100%;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--ink);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.86em}
code{background:var(--wash);padding:0 .3em;border-radius:2px}
.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.cond{font-stretch:62%;font-weight:800;letter-spacing:-.01em}
.cap{font:700 11px/1 var(--sans);font-stretch:88%;letter-spacing:.09em;text-transform:uppercase}
/* the two markers: yellow = an agent is working on it, pink = it waits on you */
.hl{background:var(--hl);color:var(--mark);padding:0 .28em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl code,.yo code{background:none;padding:0}
.yo{background:var(--you);color:var(--mark);padding:0 .28em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.bad{color:var(--bad)}

/* mock strip + top bar */
.mock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:5px 16px;background:var(--ink);color:var(--paper);font-size:12px}
.mock b{font-stretch:88%;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.mock span{opacity:.75;flex:1;min-width:200px}
.mock button{border:1px solid currentColor;padding:1px 9px;font-size:11.5px;opacity:.9}
.top{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--ink)}
.brand{font:900 26px/1 var(--sans);font-stretch:62%;text-transform:uppercase;letter-spacing:.01em}
.brand small{font:500 12px var(--mono);text-transform:none;color:var(--ink2);margin-left:8px;letter-spacing:0}
.health{margin-left:auto;font-size:12.5px;color:var(--ink2);text-align:right;line-height:1.3}
.health b{color:var(--ink);font-weight:700}
.health u{text-decoration:underline dotted;text-underline-offset:3px}
.tbtn{border:1px solid var(--line);padding:4px 10px;font-size:12px;white-space:nowrap}
#hp{position:absolute;right:16px;top:86px;z-index:20;width:min(430px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--ink);box-shadow:var(--shadow);padding:16px}
#hp dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:baseline}
#hp dt{font:800 22px/1 var(--sans);font-stretch:62%;text-align:right}
#hp dd{margin:0;color:var(--ink2);font-size:12.5px}
#hp dd b{color:var(--ink);font-weight:600}
#hp p{margin:12px 0 0;font-size:12px;color:var(--ink2)}

/* three panes */
.app{flex:1;min-height:0;display:grid;grid-template-columns:330px minmax(0,1fr) 390px}
.app>*{min-height:0;overflow:auto;overscroll-behavior:contain}
#list{border-right:1px solid var(--ink)}
#proof{border-left:1px solid var(--ink)}
.grp{display:flex;justify-content:space-between;padding:14px 16px 6px;position:sticky;top:0;background:var(--paper);z-index:1}
.grp i{font-style:normal;color:var(--ink3)}
.row{display:grid;grid-template-columns:58px 1fr;gap:0 4px;width:100%;padding:9px 16px 11px;border-top:1px solid var(--line2);position:relative}
.row[aria-current=true]{background:var(--wash)}
.row[aria-current=true]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ink)}
.row .n{font:800 34px/.9 var(--sans);font-stretch:62%;grid-row:span 3}
.row .n.s{font-size:19px;line-height:1.1;padding-top:3px}
.row>span{min-width:0}
.row .t{font-weight:600;line-height:1.25}
.row .m{color:var(--ink2);font-size:12px;margin-top:2px}
.row .now{font:500 11.5px/1.5 var(--mono);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.rej .t{text-decoration:line-through;color:var(--ink3)}
.row.rej .n{color:var(--ink3)}
.ticks{display:flex;gap:2px;margin-top:6px}
.ticks i{flex:1;height:5px;background:var(--line2)}
.ticks i.d{background:var(--ink)} .ticks i.c{background:var(--hl);outline:1px solid var(--ink);outline-offset:-1px} .ticks i.w{background:var(--you);outline:1px solid var(--ink);outline-offset:-1px}
.ticks i.k{background:repeating-linear-gradient(90deg,var(--ink3) 0 2px,transparent 2px 4px)} .ticks i.f{background:var(--bad)}

/* run sheet */
#sheet{padding:0 28px 60px}
.back{display:none}
.shead{display:grid;grid-template-columns:auto 1fr;gap:4px 20px;align-items:end;padding:22px 0 14px}
.big{font:900 112px/.78 var(--sans);font-stretch:62%;letter-spacing:-.02em}
.shead h1{margin:0;font:700 24px/1.12 var(--sans);font-stretch:88%;letter-spacing:-.01em;max-width:30ch;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;color:var(--ink2);font-size:12.5px}
.meta b{color:var(--ink);font-weight:600}
.ruler{display:grid;grid-template-columns:repeat(10,1fr);border:1px solid var(--ink);margin:6px 0 4px}
.ruler button{padding:7px 7px 8px;border-left:1px solid var(--line);min-width:0;position:relative}
.ruler button:first-child{border-left:0}
.ruler .s{display:block;font:700 11px/1.1 var(--sans);font-stretch:80%;letter-spacing:.07em;text-transform:uppercase}
.ruler .w{display:block;font:400 10.5px/1.25 var(--mono);color:var(--ink3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ruler .g{display:block;font:700 12px/1 var(--mono);margin-top:6px}
.ruler .d{background:var(--ink);color:var(--paper)} .ruler .d .w{color:inherit;opacity:.6}
.ruler .c{background:var(--hl);color:var(--mark)} .ruler .c .w{color:inherit;opacity:.7}
.ruler .y{background:var(--you);color:var(--mark)} .ruler .y .w{color:inherit;opacity:.7}
.ruler .k .s{color:var(--ink3);text-decoration:line-through}
.ruler .hadf::after{content:"";position:absolute;right:5px;top:6px;width:7px;height:7px;background:var(--bad);border-radius:50%}
.legend{font-size:11.5px;color:var(--ink3);margin:0 0 18px}
.h2{display:flex;align-items:baseline;gap:12px;margin:26px 0 0;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.h2 span{color:var(--ink3);font-size:12px}
.perf{display:flex;gap:10px;align-items:baseline;margin-top:14px;padding:9px 0 5px;border-top:2px dashed var(--ink);font-size:12.5px;color:var(--ink2)}
.perf b{font:800 15px/1 var(--sans);font-stretch:70%;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);white-space:nowrap}
.run{border-bottom:1px solid var(--line2)}
.rh{display:grid;grid-template-columns:86px 178px minmax(0,1fr) 58px 48px;gap:0 12px;width:100%;padding:8px 0;align-items:baseline}
.rh:disabled{cursor:default}
.rh .st{font:700 12px/1.3 var(--sans);font-stretch:85%;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.rh .st i{font:700 12px var(--mono);font-style:normal;display:inline-block;width:15px}
.rh .who{font:400 11.5px/1.5 var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rh .who.eng{color:var(--ink3)}
.rh .ln{font-size:13px;line-height:1.4}
.run:not(.open) .rh .ln{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rh .tm,.rh .us{text-align:right;color:var(--ink2)}
.run.r-fail .st,.run.r-refused .st{color:var(--bad)}
.run.r-you .ln{font-style:italic}
.run .more{font:400 11px var(--mono);color:var(--ink3);margin-left:6px;white-space:nowrap}
.feed{margin:0 0 12px 98px;border-left:3px solid var(--ink);padding:4px 0 4px 12px;font:400 12px/1.65 var(--mono)}
.ev{display:grid;grid-template-columns:62px 62px minmax(0,1fr);gap:0 8px}
.ev time{color:var(--ink3)} .ev b{font-weight:700} .ev i{font-style:normal;color:var(--ink3);margin-left:8px}
.ev.say span{font-family:var(--sans);font-size:13px;line-height:1.45;padding:2px 0}
.ev.ok b{color:var(--ink3);font-weight:400} .ev.err span,.ev.err b{color:var(--bad)} .ev.sys b{color:var(--ink3);font-weight:400}
.ev span{overflow-wrap:anywhere}
.ev.new span{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 0/100% 100%;color:var(--mark);animation:sweep .7s ease-out;padding:0 .3em;justify-self:start}
@keyframes sweep{from{background-size:0 100%}}
.caret{display:inline-block;width:7px;height:13px;background:var(--ink);vertical-align:-2px;margin-left:70px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.nowp{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--hl);padding:12px 16px 8px;margin:6px 0 4px}
.nh{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.nh b{font:700 17px/1 var(--sans);font-stretch:88%} .nh .who{font:400 11.5px var(--mono);color:var(--ink2);margin-right:auto}
.nowp .feed{margin:0;border:0;padding:0;min-height:158px}
.nowp .caret{margin-left:0}
/* waiting on you */
.ask{border:2px solid var(--ink);margin:6px 0 4px;padding:16px 18px 16px;background:var(--paper);box-shadow:6px 6px 0 var(--you)}
.ask .q{font:600 19px/1.3 var(--sans);font-stretch:92%;margin:10px 0 6px;max-width:56ch}
.ask .d{color:var(--ink2);margin:0 0 12px;max-width:68ch;font-size:13px}
textarea{width:100%;min-height:74px;font:400 14px/1.45 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--ink);padding:9px 10px;resize:vertical;border-radius:0}
.sug{display:flex;flex-direction:column;gap:4px;margin:8px 0 12px}
.sug button{font-size:12.5px;color:var(--ink2);padding:3px 0}
.sug button::before{content:"↳ ";font-family:var(--mono)}
.sug button:hover{color:var(--ink)}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);padding:7px 14px;font-weight:700;font-stretch:88%;font-size:13px}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:600}
.acts code{color:var(--ink3);background:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.opt{border:1px solid var(--line);padding:10px 12px;display:block;cursor:pointer}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt b{display:block;font-weight:700}
.opt span{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px}
.opt:has(input:checked){border:2px solid var(--ink);padding:9px 11px;background:var(--wash)}
.opt:has(input:checked) b::after{content:"  ✓"}
.sq+.sq{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

/* proof column */
.tabs{display:flex;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:2}
.tabs button{flex:1;padding:12px 6px 10px;text-align:center;font:700 12px/1 var(--sans);font-stretch:88%;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);border-left:1px solid var(--line2)}
.tabs button:first-child{border-left:0}
.tabs button[aria-selected=true]{color:var(--paper);background:var(--ink)}
.pp{padding:16px 18px 50px}
.verd{font:900 46px/.9 var(--sans);font-stretch:62%;text-transform:uppercase;margin:2px 0 4px}
.sub{color:var(--ink2);font-size:12.5px;margin:0 0 14px}
.crit{border-top:1px solid var(--ink);padding:12px 0 14px}
.crit h3{display:flex;align-items:baseline;gap:10px;margin:0 0 5px;font:800 26px/1 var(--sans);font-stretch:62%}
.crit h3 em{font:800 15px/1 var(--sans);font-stretch:75%;font-style:normal;letter-spacing:.05em;margin-left:auto}
.crit p{margin:0 0 8px}
.kv{display:grid;grid-template-columns:54px minmax(0,1fr);gap:2px 8px;font:400 11.5px/1.55 var(--mono);color:var(--ink2);margin-bottom:8px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.s{font-family:var(--sans);font-size:12.5px}
.hist{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.hist div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hist .r{font:700 11px var(--mono);width:52px;color:var(--ink3)}
.chip{font:500 11px/1 var(--mono);border:1px solid var(--line);padding:3px 6px}
.chip[aria-expanded=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.evd{margin:8px 0 0;border:1px solid var(--ink)}
.evd header{display:flex;gap:8px;justify-content:space-between;padding:5px 8px;border-bottom:1px solid var(--line);font:500 11px/1.4 var(--mono)}
.evd pre{margin:0;padding:8px;font:400 11px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;background:var(--wash)}
.shot{padding:14px 10px;background:var(--wash)}
.shot div{background:#f8ecc4;color:#3b2f06;border:1px solid #d9c27a;border-radius:6px;padding:8px 10px;font:500 12px/1.3 system-ui;white-space:nowrap;overflow:hidden}
.shot small{display:block;margin-top:6px;color:var(--ink2);font-size:11.5px}
.find{border-top:1px solid var(--ink);padding:12px 0 14px}
.find h3{margin:4px 0 4px;font:700 15px/1.25 var(--sans)}
.find .l{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font:500 11.5px var(--mono);color:var(--ink2)}
.find .l b{font:800 13px/1 var(--sans);font-stretch:75%;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.find p{margin:0 0 8px;color:var(--ink2);font-size:13px}
.find.dis h3,.find.dis p{text-decoration:line-through;color:var(--ink3)}
.lens{display:flex;gap:6px 14px;flex-wrap:wrap;font:500 12px var(--mono);margin:0 0 14px}
.req{display:grid;grid-template-columns:30px 1fr;gap:5px 6px;margin:8px 0 0;font-size:13px}
.req dt{font:700 11.5px/1.6 var(--mono)} .req dd{margin:0}
.tk{font-size:15px;line-height:1.45;margin:0 0 16px}
.feat{margin:0;padding:0;list-style:none}
.feat li{border-top:1px solid var(--line);padding:8px 0}
.feat b{display:block} .feat span{color:var(--ink2);font-size:12.5px}
.cost{display:grid;grid-template-columns:110px 1fr 46px;gap:5px 8px;align-items:center;font:400 11.5px var(--mono);margin-top:8px}
.cost i{display:block;height:9px;background:var(--ink)}

@media (max-width:1180px){.app{grid-template-columns:300px minmax(0,1fr)}#proof{grid-column:2;border-left:0;border-top:1px solid var(--ink);overflow:visible}#sheet{overflow:visible;padding-bottom:20px}.app{overflow:auto}#list{position:sticky;top:0;align-self:start;max-height:100%}}
@media (max-width:760px){
  body{display:block;height:auto} .app{display:block;overflow:visible} .app>*{overflow:visible}
  #list{position:static;border:0;max-height:none} .app[data-view=sheet] #list{display:none} .app[data-view=list] #sheet,.app[data-view=list] #proof{display:none}
  #sheet{padding:0 16px 20px} .back{display:inline-block;margin-top:12px;font-weight:700;border-bottom:2px solid var(--ink)}
  .health{display:none} .top{gap:10px} .big{font-size:72px} .shead{grid-template-columns:1fr} .shead h1{font-size:20px}
  .ruler{grid-template-columns:repeat(5,1fr)} .ruler button:nth-child(6){border-left:0} .ruler button:nth-child(n+6){border-top:1px solid var(--line)}
  .rh{grid-template-columns:1fr auto auto;gap:2px 10px} .rh .st{grid-column:1} .rh .who{grid-column:1/-1;grid-row:2} .rh .ln{grid-column:1/-1;grid-row:3} .rh .tm{grid-row:1;grid-column:2} .rh .us{grid-row:1;grid-column:3}
  .feed{margin-left:0} .ev{grid-template-columns:54px minmax(0,1fr)} .ev time{display:none} .caret{margin-left:0}
  .opts{grid-template-columns:1fr} .grp{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="mock"><b>Mock-up · Direction A · Docket</b><span>Jobs 001–006 are real kitchen-dog data. The live activity, job 007 and the review findings on 003 are simulated examples and loop.</span><button id="pause">Pause</button><button id="restart">Restart</button></div>
<header class="top">
  <div class="brand">Kitchen<small>this machine · 2 repos</small></div>
  <button class="health" id="health" aria-expanded="false" aria-controls="hp"></button>
  <button class="tbtn" id="theme">Dark</button>
</header>
<div id="hp" hidden></div>
<main class="app" data-view="list">
  <nav id="list" aria-label="Jobs"></nav>
  <section id="sheet" aria-live="off"></section>
  <aside id="proof"></aside>
</main>
<script>
// ───────────────────────────────────────────────────────────────────────────
// Mock-up model + simulation (shared by the three directions; inlined per file).
// Jobs 001–006 are the real kitchen-dog jobs (titles, criteria, agent runs, times,
// costs, verdict rows, the question on 006). Job 007 and the review findings on 003
// are invented examples, and "live" activity is a timer replaying a script.
// The real build would read job.json, the ledger, rounds/*, evidence/* and each
// agent run's session transcript (src/agents/claude.ts → transcriptPath).
// ───────────────────────────────────────────────────────────────────────────
const K = (() => {
  const STAGES = ["intake", "spec", "build", "gate", "drives", "verify", "review", "ready", "report", "done"];
  const LABEL = { intake: "Intake", spec: "Spec", repro: "Repro", build: "Build", gate: "Gate", drives: "Drives", verify: "Verify", toolkit: "Toolkit", review: "Review", ready: "Ready", report: "Report", done: "Done", "needs-info": "Needs info", "needs-human": "Needs you", rejected: "Rejected", you: "You" };
  // who works each stage by default (shown on headers); a run can override
  const WHO = {
    intake: { who: "intake", ad: "claude", m: "sonnet" }, spec: { who: "spec", ad: "claude", m: "opus" }, repro: { who: "verifier", ad: "claude", m: "sonnet" },
    build: { who: "builder", ad: "claude", m: "sonnet" }, gate: { eng: "typecheck · lint · tests" }, drives: { who: "verifier", ad: "claude", m: "sonnet" },
    verify: { eng: "runs every proof" }, review: { who: "reviewer", ad: "claude", m: "opus" }, ready: { eng: "sync base · publish" },
    report: { who: "report", ad: "claude", m: "sonnet" }, done: { eng: "" },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const code = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

    }
  } else if (tab === "tick") {
    body = `<span class="cap">Ticket</span><p class="tk">${esc(j.ticket)}</p><span class="cap">Requirements from intake</span><dl class="req">${j.reqs.map((r) => `<dt>${r[0]}</dt><dd>${code(r[1])}${r[2] ? ' <span class="mono" style="color:var(--ink3)">negative</span>' : ""}</dd>`).join("")}</dl>
      <p class="sub" style="margin-top:16px">branch <code>${esc(j.branch)}</code></p>`;
  } else {
    const by = {}; j.runs.forEach((r) => { if (r.usd) by[r.who] = (by[r.who] || 0) + r.usd; });
    const max = Math.max(...Object.values(by), 0.01), agentSecs = j.runs.reduce((n, r) => n + (r.who ? K.secsOf(r) : 0), 0);
    body = `<div class="verd">${usd(j.usd)}</div><p class="sub">${j.runs.filter((r) => r.who).length} agent runs, ${dur(agentSecs)} of agent time. The engine's own steps cost nothing.</p><div class="cost">${Object.entries(by).sort((a, b) => b[1] - a[1]).map(([w, v]) => `<span>${w}</span><span><i style="width:${(v / max) * 100}%"></i></span><span style="text-align:right">${usd(v)}</span>`).join("")}</div>`;
  }
  return `<div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${t}</button>`).join("")}</div><div class="pp">${body}</div>`;
}
function proofSetup() {
  const su = K.state.setup;
  return `<div class="tabs"><button aria-selected="true">What the survey found</button></div><div class="pp"><div class="verd">5 features</div><p class="sub">${esc(su.about)} Survey by setup · claude · opus, 85 s, $0.81. Each feature gets at least one drive, a list of Toolkit commands that reaches and exercises it.</p>
  <ul class="feat">${su.features.map((f, i) => `<li><b>${esc(f[0])}</b><span>${esc(f[1])}${i === 4 && su.questions[0].a === "engine" ? ' · <b class="bad">Toolkit gap with engine only</b>' : ""}</span></li>`).join("")}</ul></div>`;
}
function renderProof() { patch($("#proof"), sel.type === "setup" ? proofSetup() : proofJob(K.job(sel.id))); }
function renderHealth() {
  const h = K.health, n = K.needs().length, l = K.live().length;
  patch($("#health"), `<b>${l}</b> cooking · <b>${n}</b> waiting on you<br><u>${h.mergeReady} of ${h.takenIn} tickets merge-ready · ${usd(h.medianUsd)} and ${dur(h.medianSecs)} per ready PR</u>`);
  patch($("#hp"), `<span class="cap">Health · kitchen-dog · finished jobs</span><dl>
    <dt>${Math.round((h.mergeReady / h.takenIn) * 100)}%</dt><dd><b>merge-ready</b>: ${h.mergeReady} of ${h.takenIn} tickets taken in</dd>
    <dt>${Math.round((h.firstPass / h.verified) * 100)}%</dt><dd><b>first-pass verdict</b>: ${h.firstPass} of ${h.verified} passed verify on the first try</dd>
    <dt>${h.rounds}</dt><dd><b>rounds per job</b>, mean, past intake</dd>
    <dt>${usd(h.usd)}</dt><dd><b>spent</b>: median ${usd(h.medianUsd)} and ${dur(h.medianSecs)} per ready PR</dd>
    <dt>0%</dt><dd><b>inconclusive</b> ${h.inconclusive} of ${h.verdicts} verdicts · <b>flaky</b> ${h.flaky} of ${h.proofs} proofs</dd>
    <dt>${h.gaps}</dt><dd><b>Toolkit gaps</b> per job</dd></dl>
    <p>Why jobs stopped: ${h.escalations.map((e) => `${e[0]} ×${e[1]}`).join(" · ")}</p>`);
}
function fill() { const now = Date.now(); document.querySelectorAll("[data-t0]").forEach((n) => { n.textContent = dur((now - +n.dataset.t0) / 1000); }); }
function all() { renderList(); renderSheet(); renderProof(); renderHealth(); }
function select(s) { sel = s; openEv = null; if (s.type === "job") { const j = K.job(s.id); tab = j.stage === "review" || K.blocking(j).length ? "rev" : "crit"; } $(".app").dataset.view = "sheet"; all(); $("#sheet").scrollTop = 0; if (matchMedia("(max-width:760px)").matches) scrollTo(0, 0); }

K.on((type, p) => {
  if (type === "clock") return fill();
  if (type === "reset") { if (sel.type === "job" && !K.job(sel.id)) sel = { type: "job", id: "005" }; return all(); }
  renderList(); renderHealth();
  const mine = sel.type === "setup" ? type.startsWith("setup") : p && p.j && p.j.id === sel.id;
  if (mine || type === "state") { renderSheet(); renderProof(); }
  $("#pause").textContent = K.paused ? "Resume" : "Pause";
});
document.addEventListener("input", (e) => { if (e.target.id === "ans") drafts[e.target.dataset.for] = e.target.value; });
document.addEventListener("change", (e) => { if (e.target.dataset.q) K.setupAnswer(e.target.dataset.q, e.target.value); });
document.addEventListener("click", (e) => {
  const t = e.target.closest("button,[data-job]"); if (!t) { if (!e.target.closest("#hp")) { $("#hp").hidden = true; $("#health").setAttribute("aria-expanded", "false"); } return; }
  const d = t.dataset, j = sel.type === "job" ? K.job(sel.id) : null;
  if (t.id === "health") { const h = $("#hp"); h.hidden = !h.hidden; t.setAttribute("aria-expanded", String(!h.hidden)); return; }
  $("#hp").hidden = true;
  if (t.id === "pause") K.paused = !K.paused;
  else if (t.id === "restart") { K.paused = false; K.reset(); }
  else if (t.id === "theme") { const dark = getComputedStyle(document.documentElement).colorScheme === "dark"; document.documentElement.dataset.theme = dark ? "light" : "dark"; t.textContent = dark ? "Dark" : "Light"; }
  else if (d.job) select({ type: "job", id: d.job });
  else if ("setup" in d) select({ type: "setup" });
  else if ("back" in d) { $(".app").dataset.view = "list"; }
  else if (d.run) { const k = (sel.type === "setup" ? "setup" : sel.id) + ":" + d.run; const r = sel.type === "setup" ? K.state.setup.steps[d.run] : j.runs[d.run]; opened.has(k) ? opened.delete(k) : opened.add(k); cache.delete($("#sheet")); renderSheet(); }
  else if (d.stage) { let i = -1; j.runs.forEach((r, n) => { if (norm(r.s) === d.stage) i = n; }); if (i >= 0) { if (j.runs[i].ev.length) opened.add(j.id + ":" + i); renderSheet(); $("#run-" + i)?.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" }); } }
  else if (d.sstep) { const i = K.state.setup.steps.findIndex((s) => s.id === d.sstep); $("#run-" + i)?.scrollIntoView({ block: "center" }); }
  else if (d.tab) { tab = d.tab; renderProof(); }
  else if (d.ev) { openEv = openEv === d.ev ? null : d.ev; renderProof(); }
  else if (d.dis) { const f = j.review.findings.find((x) => x.id === d.dis); K.dismiss(j.id, d.dis, !f.dismissed); }
  else if (d.sug) { drafts[j.id] = j.ask.suggest[d.sug]; cache.delete($("#sheet")); renderSheet(); $("#ans").focus(); }
  else if (d.send) { const v = (drafts[d.send] || "").trim(); if (!v) return $("#ans").focus(); K.answer(d.send, v); delete drafts[d.send]; }
  else if (d.reject) K.reject(d.reject);
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("textarea,input") || e.metaKey || e.ctrlKey) return;
  if (e.key === "j" || e.key === "k") { const rows = [...document.querySelectorAll("#list .row")], i = rows.findIndex((r) => r.getAttribute("aria-current") === "true"); const n = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "j" ? 1 : -1)))]; if (n) n.click(); }
  if (e.key === "Escape") $("#hp").hidden = true;
});
if (getComputedStyle(document.documentElement).colorScheme === "dark") $("#theme").textContent = "Light";
all();
if (!matchMedia("(max-width:760px)").matches) $(".app").dataset.view = "sheet";
</script>
</body>
</html>
