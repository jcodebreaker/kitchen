<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen</title>
<!--
  Mock-up: one calm board. Jobs 001–006 are the real kitchen-dog runs; job 007 and
  the Setup row are examples; "live" movement is a timer replaying a script.
-->
<style>
  :root {
    --bg: #14151b; --panel: #1a1c24; --card: #20222c; --card-hover: #252835; --line: #2b2e3b;
    --text: #e4e5ea; --muted: #8a8fa5; --faint: #5d6278;
    --active: #8be9fd; --pass: #50fa7b; --changes: #ffb86c; --human: #ff5c5c; --merged: #bd93f9;
    --scrim: rgba(5, 6, 10, .36);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f4f4f0; --panel: #fbfbf9; --card: #ffffff; --card-hover: #fafaf7; --line: #dfdfd8;
    --text: #1c1d22; --muted: #5f6377; --faint: #9698a6;
    --active: #0b7189; --pass: #17783a; --changes: #a85808; --human: #cf2f36; --merged: #6a44c4;
    --scrim: rgba(40, 40, 50, .18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, textarea { font: inherit; color: inherit; }
  code { font-family: var(--mono); font-size: .92em; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 28px 32px 8px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  .status b { font-weight: 500; color: var(--text); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; }
  .dot.run { background: var(--active); animation: pulse 1.6s ease-in-out infinite; }
  .dot.you { background: var(--human); }
  .dot.ok { background: var(--pass); }

  /* Setup row */
  .setup {
    margin: 14px 32px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .setup:hover { background: var(--card-hover); }
  .setup:focus-visible, .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .setup.human { border-color: color-mix(in srgb, var(--human) 70%, var(--line)); }
  .setup.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .s-main { flex: 1 1 300px; min-width: 0; }
  .s-top { display: flex; align-items: center; gap: 8px; }
  .s-top h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .s-top .flag { margin-left: 4px; }
  .s-line { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .s-line .act { color: var(--text); }
  .q { display: flex; align-items: center; gap: 10px; }
  .q-t { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button {
    background: none; border: 0; padding: 5px 11px; font-size: 12px; cursor: pointer; color: var(--muted); white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button:hover { color: var(--text); background: var(--card-hover); }
  .seg button.on { color: var(--bg); background: var(--text); }

  /* Board */
  .board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; padding: 22px 32px 36px; align-items: start; }
  .col { min-width: 0; }
  .col-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative; }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .col-head .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .col.flow:not(.last-flow) .col-head::after { content: "›"; position: absolute; right: -10px; top: -2px; color: var(--faint); font-size: 16px; }
  .col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
  .col.human h2 { color: var(--human); }
  .col.done-col h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }

  .card {
    display: block; width: 100%; text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 10px 10px; margin-bottom: 10px; transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .card.human {
    border-color: var(--human);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent), 0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent);
  }
  .card.done { opacity: .72; }
  .card.rejected .title { text-decoration: line-through; text-decoration-color: var(--faint); }
  .card.sel, .setup.sel { border-color: var(--text); }
  .card.arrived { animation: arrive 1.8s ease-out both; }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-family: var(--mono); font-size: 9.5px; color: var(--faint); border: 1px dashed var(--faint); border-radius: 4px; padding: 0 4px; }
  .flag { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--human); white-space: nowrap; }
  .flag.rej { color: var(--changes); }
  .title { font-size: 13px; line-height: 1.4; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* the one new thing on a card: what its agent is doing right now */
  .now { margin-top: 9px; padding: 7px 8px; border-radius: 6px; background: color-mix(in srgb, var(--active) 8%, transparent); font-family: var(--mono); font-size: 10.5px; line-height: 1.5; }
  .now-top { color: var(--active); display: flex; align-items: center; white-space: nowrap; }
  .now-top .el { margin-left: auto; color: var(--muted); }
  .now-do { color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

  .rounds { margin-top: 10px; display: grid; gap: 5px; }
  .round { display: flex; align-items: center; gap: 3px; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 18px; }
  .chip { flex: 1; text-align: center; font-family: var(--mono); font-size: 9.5px; padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint); }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; border-color: var(--active); color: var(--active); }
  .chip.PASS { border: 1px solid transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .chip.FAIL { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .meta { display: flex; gap: 10px; margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); flex-wrap: wrap; }
  .meta .risk-high { color: var(--human); } .meta .risk-medium { color: var(--changes); }
  .hint { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
  .hint .go { display: block; margin-top: 6px; color: var(--human); font-weight: 600; }

  footer { padding: 0 32px 32px; font-family: var(--mono); font-size: 11px; color: var(--faint); display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: center; }
  footer .sp { margin-left: auto; }
  footer button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--faint); font: inherit; text-decoration: underline; text-underline-offset: 2px; }
  footer button:hover { color: var(--text); }

  /* Side panel */
  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%); transition: transform .25s ease; visibility: hidden;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .panel { transform: none; visibility: visible; }
  .p-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .p-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .p-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .p-body { overflow-y: auto; padding: 4px 24px 48px; }
  .sec { padding-top: 18px; }
  .sec > h4 { margin: 0 0 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); display: flex; gap: 8px; align-items: baseline; }
  .sec > h4 span { text-transform: none; letter-spacing: 0; font-family: var(--mono); font-weight: 400; margin-left: auto; }
  .quiet { color: var(--faint); font-size: 12.5px; margin: 0; }

  /* 4 · your call (shown first when there is one) */
  .call { border: 1px solid var(--human); border-radius: 10px; padding: 14px; margin-top: 18px; }
  .call h4 { margin: 0 0 6px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--human); }
  .call p { margin: 0 0 8px; font-size: 13px; }
  .call p.why { color: var(--muted); font-size: 12px; }
  .call textarea { width: 100%; min-height: 76px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
  .call textarea:focus { outline: none; border-color: var(--active); }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line); background: none; border-radius: 7px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .btn.link { border: 0; padding: 6px 0; color: var(--active); }
  .btn.quiet-b { color: var(--muted); margin-left: auto; }
  .cmd { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 8px; }
  .sq + .sq { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 10px; margin-top: 6px; cursor: pointer; }
  .opt:hover { border-color: var(--muted); }
  .opt b { display: block; font-size: 13px; font-weight: 600; }
  .opt span { display: block; font-size: 12px; color: var(--muted); }
  .opt.on { border-color: var(--text); background: var(--card); }
  .opt.on b::after { content: "  ✓"; color: var(--pass); }

  /* 1 · steps */
  .step { display: grid; grid-template-columns: 16px 1fr auto; gap: 0 10px; padding: 6px 0; align-items: baseline; }
  .step .ic { font-family: var(--mono); font-size: 12px; text-align: center; color: var(--faint); }
  .step .nm { font-size: 13px; font-weight: 500; }
  .step .nm small { font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--faint); margin-left: 6px; }
  .step .tm { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .step .ln { grid-column: 2 / 4; font-size: 12px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .step.done .ic { color: var(--pass); }
  .step.live .ic, .step.live .nm { color: var(--active); }
  .step.live .ic { animation: pulse 1.6s ease-in-out infinite; }
  .step.you .ic, .step.you .nm, .step.rejected .ic { color: var(--human); }
  .step.wait .nm, .step.skip .nm { color: var(--faint); font-weight: 400; }
  .step.wait .ln, .step.skip .ln { color: var(--faint); }

  /* 2 · live feed */
  .feed { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.6; }
  .ev { display: grid; grid-template-columns: 52px 1fr; gap: 8px; color: var(--muted); }
  .ev .at { color: var(--faint); }
  .ev .x { overflow-wrap: anywhere; }
  .ev.tool .x b { color: var(--active); font-weight: 500; }
  .ev.say .x { color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-size: 12px; }
  .ev.err .x { color: var(--human); }
  .ev:last-child .x { color: var(--text); }
  .ev.err:last-child .x { color: var(--human); }

  /* 3 · criteria */
  .crit { display: grid; grid-template-columns: 58px 1fr; gap: 0 10px; padding: 7px 0; align-items: start; }
  .crit .chip { flex: none; margin-top: 2px; font-size: 10px; }
  .crit .chip.stale { opacity: .5; }
  .crit .tx { font-size: 12.5px; line-height: 1.45; }
  .crit .tx b { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); margin-right: 4px; }
  .crit .sub { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 3px; display: flex; gap: 4px 10px; flex-wrap: wrap; }
  .crit .sub .bad { color: var(--human); }
  .evl { background: none; border: 0; padding: 0; cursor: pointer; color: var(--active); font: inherit; }
  .evl:hover, .evl.on { text-decoration: underline; }
  .evb { grid-column: 1 / 3; margin: 6px 0 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 10.5px; line-height: 1.55; }
  .evb .c { color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .evb .c i { font-style: normal; margin-left: auto; }
  .evb pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; color: var(--text); max-height: 180px; overflow: auto; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes arrive { 0% { box-shadow: 0 0 0 2px var(--active); transform: translateY(-4px); } 100% { box-shadow: 0 0 0 0 transparent; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .dot.run, .chip.wait, .step.live .ic, .card.arrived { animation: none; } }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 28px; }
    .col-head::after { display: none; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .setup { margin: 12px 16px 0; }
    .q { flex: 1 1 100%; justify-content: space-between; }
    .board { grid-template-columns: 1fr; padding: 18px 16px 28px; row-gap: 22px; }
    .col.human { order: -1; }
    .col.none { display: none; }
    footer { padding: 0 16px 24px; }
    footer .sp { margin-left: 0; }
    .p-head { padding: 16px; }
    .p-body { padding: 0 16px 40px; }
  }
</style>
</head>
<body>
<header>
  <h1>Kitchen</h1>
  <div class="status" id="status"></div>
</header>
<div id="setup"></div>
<main class="board" id="board"></main>
<footer>
  <span>kitchen ticket "…"</span>
  <span>kitchen run</span>
  <span>kitchen feedback &lt;job&gt;</span>
  <span id="totals"></span>
  <span class="sp">mock-up · 001–006 are real kitchen-dog runs · 007 and Setup are examples · movement is replayed</span>
  <button id="theme" type="button">light</button>
</footer>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title">
    <div class="p-head">
      <div class="num" id="p-num"></div>
      <h3 id="p-title"></h3>
      <div class="p-sub" id="p-sub"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="p-body">
      <div id="p-call"></div>
      <section class="sec"><h4>Steps</h4><div id="p-steps"></div></section>
      <section class="sec"><h4>Doing now <span id="p-who"></span></h4><div id="p-feed"></div></section>
      <section class="sec" id="p-crit-sec"><h4>Criteria <span id="p-crit-n"></span></h4><div id="p-crit"></div></section>
    </div>
  </aside>
</div>

<script>
// ───────────────────────────────────────────────────────────────────────────
// Mock-up model + simulation (shared by the three directions; inlined per file).
// Jobs 001–006 are the real kitchen-dog jobs (titles, criteria, agent runs, times,
// costs, verdict rows, the question on 006). Job 007 and the review findings on 003
// are invented examples, and "live" activity is a timer replaying a script.
// The real build would read job.json, the ledger, rounds/*, evidence/* and each
// agent run's session transcript (src/agents/claude.ts → transcriptPath).
// ───────────────────────────────────────────────────────────────────────────
const K = (() => {
  const STAGES = ["intake", "spec", "build", "gate", "drives", "verify", "review", "ready", "report", "done"];
  const LABEL = { intake: "Intake", spec: "Spec", repro: "Repro", build: "Build", gate: "Gate", drives: "Drives", verify: "Verify", toolkit: "Toolkit", review: "Review", ready: "Ready", report: "Report", done: "Done", "needs-info": "Needs info", "needs-human": "Needs you", rejected: "Rejected", you: "You" };
  // who works each stage by default (shown on headers); a run can override
  const WHO = {
    intake: { who: "intake", ad: "claude", m: "sonnet" }, spec: { who: "spec", ad: "claude", m: "opus" }, repro: { who: "verifier", ad: "claude", m: "sonnet" },
    build: { who: "builder", ad: "claude", m: "sonnet" }, gate: { eng: "typecheck · lint · tests" }, drives: { who: "verifier", ad: "claude", m: "sonnet" },
    verify: { eng: "runs every proof" }, review: { who: "reviewer", ad: "claude", m: "opus" }, ready: { eng: "sync base · publish" },
    report: { who: "report", ad: "claude", m: "sonnet" }, done: { eng: "" },
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const code = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const dur = (s) => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : m ? `${m}m ${String(s % 60).padStart(2, "0")}s` : `${s}s`; };
  const usd = (n) => "$" + (n < 10 ? n.toFixed(2) : n.toFixed(1));
  const clock = (ms) => new Date(ms).toTimeString().slice(0, 8);

  // a(stage, round, secs, usd, line, extra) → agent run;  e(...) → engine run
  const a = (s, r, secs, usd, line, x = {}) => ({ s, r, secs, usd, line, res: "ok", ...WHO[s], ...x });
  const e = (s, r, secs, line, x = {}) => ({ s, r, secs, usd: 0, line, res: "ok", eng: WHO[s]?.eng || "engine", ...x });
  const T = (t, x, n) => ({ k: "tool", t, x, n });   // tool call
  const S = (x) => ({ k: "say", x });                // agent message
  const O = (x) => ({ k: "ok", x });                 // tool result
  const X = (x) => ({ k: "err", x });
  const Y = (x) => ({ k: "sys", x });                // engine line

  function seed() {
    const now = Date.now();
    const jobs = [
      { id: "005", slug: "005-kitchen-status-should-end-with-one-summa", short: "status summary line", title: "kitchen status should end with one summary line after the job rows",
        kind: "feature", risk: "low", stage: "build", round: 2, limit: 3, branch: "kitchen/005-kitchen-status-should-end-with-one-summa",
        ticket: "kitchen status should end with one summary line after the job rows: how many jobs, how many are done, and how many need a person (needs-info or needs-human), e.g. '4 jobs: 2 done, 1 needs you'. With no jobs it keeps printing 'no jobs' and no summary.",
        reqs: [["R1", "after the job rows, `kitchen status` prints one summary line"], ["R2", "the summary gives how many jobs there are"], ["R3", "the summary gives how many are done"], ["R4", "the summary gives how many need a person, worded like \"1 needs you\""], ["R5", "with no jobs, `kitchen status` keeps printing `no jobs`"], ["R6", "with no jobs, no summary line is printed", 1]],

    if (!t.script.length && cur(t)) { /* script over: the agent keeps "working" quietly */ }
  }
  function reset() { const s = seed(); state.jobs = s.jobs; state.setup = s.setup; idle = 0; emit("reset", {}); }
  setInterval(tick, 1150);
  setInterval(() => emit("clock", {}), 1000);

  return {
    STAGES, LABEL, WHO, state, esc, code, dur, usd, clock, job, cur, who, isAgent, waiting, secsOf, total, crit, evText, lastEv, needs, live, blocking,
    on: (f) => subs.push(f), reset,
    get paused() { return paused; }, set paused(v) { paused = v; emit("state", {}); },
    answer(id, text) { const j = job(id); if (!j || !waiting(j)) return; close(j, "ask", j.runs[j.runs.length - 1].line); j.runs.push({ s: "you", r: j.round, secs: 0, usd: 0, res: "you", eng: "kitchen feedback", line: text, t0: Date.now(), ev: [] });
      j.stage = "intake"; j.ask = null; open(j, "intake"); j.script = (j.afterAnswer || []).slice(); emit("move", { j }); },
    reject(id) { const j = job(id); if (!j) return; close(j, "ask"); j.runs.push({ s: "rejected", r: j.round, secs: 0, usd: 0, res: "fail", eng: "closed by you", line: "Rejected by you.", t0: Date.now(), ev: [] }); j.stage = "rejected"; j.ask = null; j.ended = Date.now(); emit("move", { j }); },
    dismiss(id, fid, on = true) { const f = job(id)?.review?.findings.find((x) => x.id === fid); if (f) { f.dismissed = on; emit("review", { j: job(id) }); } },
    setupAnswer(qid, v) { const su = state.setup; const q = su.questions.find((x) => x.id === qid); if (!q || su.steps.find((s) => s.id === "questions").st !== "ask") return; q.a = v; if (su.questions.every((x) => x.a)) su.script = setupScript(); emit("setup", {}); },
    health: { takenIn: 6, mergeReady: 4, firstPass: 1, verified: 4, rounds: 2, usd: 2.62, medianUsd: 0.51, medianSecs: 354, inconclusive: 0, verdicts: 7, flaky: 0, proofs: 18, gaps: 0,
      escalations: [["needs-info", 3], ["refused by spec-lint", 2], ["engine error", 1], ["rejected", 1]] },
  };
})();

</script>
<script>
const $ = (id) => document.getElementById(id);
const { esc, code, dur, usd } = K;

// The step list of a job. Kitchen's finer stages fold into these eight.
const STEPS = [
  { id: "intake", label: "Intake", who: "intake · sonnet", stages: ["intake", "repro"] },
  { id: "spec", label: "Spec", who: "spec · opus", stages: ["spec"] },
  { id: "build", label: "Build", who: "builder · sonnet", stages: ["build"] },
  { id: "gate", label: "Gate", who: "engine", stages: ["gate"] },
  { id: "verify", label: "Verify", who: "engine · verifier", stages: ["drives", "verify"] },
  { id: "review", label: "Review", who: "reviewer · opus", stages: ["review"] },
  { id: "ready", label: "Ready", who: "engine · report", stages: ["ready", "report"] },
  { id: "done", label: "Done", who: "", stages: ["done"] },
];
const COLS = [
  { label: "Intake", who: "sonnet", steps: ["intake"] },
  { label: "Spec", who: "opus", steps: ["spec"] },
  { label: "Build", who: "sonnet · gate", steps: ["build", "gate"] },
  { label: "Verify", who: "engine", steps: ["verify"] },
  { label: "Review", who: "opus", steps: ["review"] },
  { label: "Ready", who: "engine", steps: ["ready"], cls: "last-flow" },
  { label: "Needs you", who: "you", stages: ["needs-info", "needs-human"], cls: "human" },
  { label: "Done", who: "proven", stages: ["done", "rejected"], cls: "done-col" },
];
const whoOf = (r) => (r.who ? `${r.who} · ${r.m}` : "engine");
const stepIdx = (stage) => STEPS.findIndex((s) => s.stages.includes(stage));
const colOf = (j) => COLS.findIndex((c) => (c.stages ? c.stages.includes(j.stage) : c.steps.includes(STEPS[stepIdx(j.stage)]?.id)));

const VERB = { Read: "reading", Edit: "editing", Write: "writing", Bash: "running", Grep: "searching for", toolkit: "toolkit" };
const plain = (s) => String(s).replace(/`/g, "");
// one line: what the agent is doing right now
function doing(evs) {
  for (let i = evs.length - 1; i >= 0; i--) {
    const e = evs[i];
    if (e.k === "tool") return `${VERB[e.t] || e.t} ${e.x}`;
    if (e.k === "say" || e.k === "sys") return plain(e.x);
    if (e.k === "err") return "error: " + plain(e.x);
  }
  return "starting";
}
const since = (t0) => `<span data-t0="${t0}">${dur((Date.now() - t0) / 1000)}</span>`;
const moved = {};
let openId = null, openEv = null, lastFocus = null;

// ---- Board ---------------------------------------------------------------
function rounds(j) {
  if (!j.runs.some((r) => r.s === "build")) return "";
  const closed = j.stage === "done" || j.stage === "rejected";
  let h = "";
  for (let n = 1; n <= j.round; n++) {
    const chips = ["gate", "verify", "review"].map((s) => {
      const r = j.runs.filter((x) => (x.s === s || (s === "verify" && x.s === "drives")) && x.r === n).pop();
      if (!r) return n === j.round && !closed ? `<span class="chip">${s}</span>` : "";
      const c = r.live ? "wait" : r.res === "fail" ? "FAIL" : "PASS";
      return `<span class="chip ${c}">${s}</span>`;
    }).join("");
    if (chips) h += `<div class="round"><span class="r">R${n}</span>${chips}</div>`;
  }
  return h ? `<div class="rounds">${h}</div>` : "";
}
function card(j) {
  const run = K.cur(j), you = K.waiting(j), rej = j.stage === "rejected", done = j.stage === "done";
  const cls = ["card", run && "live", you && "human", (done || rej) && "done", rej && "rejected", openId === j.id && "sel"].filter(Boolean).join(" ");
  const age = Date.now() - (moved[j.id] || 0);
  const arr = age < 1800 ? ` arrived" style="animation-delay:-${age}ms` : "";
  return `<div class="${cls}${arr}" role="button" tabindex="0" data-open="${j.id}">
    <div class="card-top"><span class="num">${j.id} · ${j.example ? "example" : j.kind}</span>${you ? '<span class="flag">Your call</span>' : rej ? '<span class="flag rej">Rejected</span>' : ""}</div>
    <p class="title">${esc(j.title)}</p>
    ${run ? `<div class="now"><div class="now-top"><span class="dot run"></span>${K.LABEL[run.s].toLowerCase()}<span class="el">${since(run.t0)}</span></div><div class="now-do">${esc(doing(run.ev))}</div></div>` : ""}
    ${rounds(j)}
    <div class="meta"><span class="risk-${j.risk}">${j.risk}</span><span>${usd(j.usd)}</span><span>${j.ended ? dur(K.total(j)) : since(j.started)}</span>${done ? "<span>report ↗</span>" : ""}</div>
    ${you && j.ask ? `<div class="hint">${esc(j.ask.why[0].toUpperCase() + j.ask.why.slice(1))}. ${esc(plain(j.ask.text).split(/(?<=[.)])\s+/).pop())}<span class="go">Answer here →</span></div>` : ""}
  </div>`;
}
const colCache = [];
function board() {
  const el = $("board");
  if (!el.children.length) el.innerHTML = COLS.map((c, i) => `<section class="col ${c.cls || ""} ${c.steps ? "flow" : ""}" id="col${i}"></section>`).join("");
  const focus = document.activeElement?.closest?.("#board [data-open]")?.dataset.open;
  COLS.forEach((c, i) => {
    const js = K.state.jobs.filter((j) => colOf(j) === i);
    const h = `<div class="col-head"><h2>${c.label}</h2><span class="who">${c.who}</span>${js.length ? `<span class="count">${js.length}</span>` : ""}</div>` + (js.map(card).join("") || '<div class="empty">—</div>');
    $("col" + i).classList.toggle("none", !js.length);
    if (colCache[i] !== h) { colCache[i] = h; $("col" + i).innerHTML = h; }
  });
  if (focus && !document.activeElement?.closest?.("#board")) el.querySelector(`[data-open="${focus}"]`)?.focus();
}

// ---- Setup row -----------------------------------------------------------
const SEG = { host: ["Host image", { engine: "Engine only", host: "Full host image" }], model: ["Model", { mock: "Mock model", key: "Real key" }] };
function setupNow() {
  const su = K.state.setup, live = su.steps.find((s) => s.st === "live"), left = su.questions.filter((q) => !q.a).length;
  const doneN = su.steps.filter((s) => s.st === "done").length;
  return { su, live, left, doneN, proven: doneN === su.steps.length, asking: su.steps.find((s) => s.id === "questions").st === "ask" };
}
let setupCache = "";
function setupRow() {
  const { su, live, left, doneN, proven, asking } = setupNow();
  const line = asking && left ? `step ${doneN + 1} of ${su.steps.length} · waiting on ${left} question${left > 1 ? "s" : ""} from you`
    : live ? `<span class="dot run"></span>${esc(live.name.toLowerCase())} · <span class="act">${esc(doing(live.ev || []))}</span> · ${since(live.t0)}`
    : proven ? `<span class="dot ok"></span>proven · review and merge <span class="act">kitchen/setup</span>` : "starting…";
  const qs = asking && left ? su.questions.map((q) => `<div class="q"><span class="q-t">${SEG[q.id][0]}</span><div class="seg">${q.opts.map(([v]) => `<button type="button" class="${q.a === v ? "on" : ""}" data-q="${q.id}" data-v="${v}">${SEG[q.id][1][v]}</button>`).join("")}</div></div>`).join("")
    : `<div class="q"><span class="q-t">${su.questions.map((q) => SEG[q.id][1][q.a].toLowerCase()).join(" · ")}</span></div>`;
  const h = `<div class="setup ${asking && left ? "human" : live ? "live" : ""} ${openId === "setup" ? "sel" : ""}" role="button" tabindex="0" data-open="setup">
    <div class="s-main"><div class="s-top"><h2>Setup</h2><span class="num">${esc(su.repo)}</span><span class="tag">example</span>${asking && left ? '<span class="flag">Your call</span>' : ""}</div><div class="s-line">${line}</div></div>${qs}</div>`;
  if (h !== setupCache) { setupCache = h; $("setup").innerHTML = h; }
}

function counts() {
  const s = setupNow(), run = K.live().length + (s.live ? 1 : 0), you = K.state.jobs.filter(K.waiting).length + (s.asking && s.left ? 1 : 0);
  $("status").innerHTML = `<span><span class="dot ${run ? "run" : ""}"></span><b>${run}</b> running</span><span><span class="dot ${you ? "you" : ""}"></span><b>${you}</b> need${you === 1 ? "s" : ""} you</span><span>${K.clock(Date.now())}</span>`;
  $("totals").textContent = `${run} running · ${usd(K.state.jobs.reduce((n, j) => n + j.usd, 0) + s.su.usd)} API-equivalent`;
}

// ---- Side panel ----------------------------------------------------------
const ICON = { done: "✓", live: "●", wait: "○", you: "!", skip: "–", rejected: "×" };
const stepRow = (st, name, who, time, line) => `<div class="step ${st}"><span class="ic">${ICON[st]}</span><span class="nm">${name}${who ? `<small>${esc(who)}</small>` : ""}</span><span class="tm">${time}</span>${line ? `<span class="ln">${line}</span>` : ""}</div>`;

function jobSteps(j) {
  const run = K.cur(j), closed = j.stage === "rejected" || K.waiting(j);
  const at = closed ? stepIdx([...j.runs].reverse().find((r) => stepIdx(r.s) >= 0).s) : stepIdx(j.stage);
  return STEPS.map((s, i) => {
    const runs = j.runs.filter((r) => s.stages.includes(r.s)), last = runs[runs.length - 1];
    let st = i > at ? "wait" : i < at || j.stage === "done" ? (runs.length || s.id === "done" ? "done" : "skip") : run ? "live" : K.waiting(j) ? "you" : "rejected";
    const secs = runs.reduce((n, r) => n + K.secsOf(r), 0);
    const time = st === "live" ? since(Date.now() - secs * 1000) : runs.length && st !== "wait" ? dur(secs) : "";
    let line = "";
    if (st === "live") line = esc(doing(run.ev));
    else if (st === "you") line = "Stopped here. Waiting for your answer.";
    else if (st === "skip") line = "not needed: intake wrote the criteria";
    else if (s.id === "done") line = st === "done" ? "Proven. Report written, branch published." : "";
    else if (last && last.line) line = (j.round > 1 && i >= 2 ? `round ${last.r} · ` : "") + code(last.line);
    const who = last ? (last.s !== s.id ? K.LABEL[last.s].toLowerCase() + " · " : "") + whoOf(last) : s.who;
    return stepRow(st, s.label, st === "wait" || st === "skip" ? s.who : who, time, line);
  }).join("");
}
function setupSteps() {
  return K.state.setup.steps.map((s) => {
    const st = s.st === "ask" ? "you" : s.st;
    const time = s.st === "live" ? since(s.t0) : s.st === "done" && s.secs ? dur(s.secs) : "";
    return stepRow(st, esc(s.name), s.by.replace(" · claude", ""), time, s.st === "live" ? esc(doing(s.ev || [])) : code(s.line));
  }).join("");
}
function feed(evs) {
  return `<div class="feed">${evs.slice(-6).map((e) => {
    const x = e.k === "tool" ? `<b>${esc(e.t)}</b> ${esc(e.x)}${e.n ? `  <span>${esc(e.n)}</span>` : ""}` : e.k === "ok" ? "→ " + esc(e.x) : e.k === "err" ? "✕ " + esc(e.x) : e.k === "say" ? code(e.x) : esc(e.x);
    return `<div class="ev ${e.k}"><span class="at">${K.clock(e.at).slice(3)}</span><span class="x">${x}</span></div>`;
  }).join("")}</div>`;
}
function criteria(j) {
  return K.crit(j).map((c) => {
    const v = c.last, chip = c.running ? '<span class="chip wait">checking</span>' : v ? `<span class="chip ${v.r} ${c.stale ? "stale" : ""}">${v.r === "PASS" ? "pass" : "fail"}</span>` : '<span class="chip">waiting</span>';
    const ev = v ? v.e.map((id, i) => `<button type="button" class="evl ${openEv === id ? "on" : ""}" data-ev="${id}" aria-label="evidence ${id}">${i ? "" : "evidence "}${id}</button>`).join("") : "";
    const shown = v && v.e.includes(openEv) ? j.evidence[openEv] : null;
    return `<div class="crit">${chip}<div><div class="tx"><b>${c.id}</b>${code(c.text)}</div>
      ${v ? `<div class="sub">${c.stale ? `<span>from round ${v.round}</span>` : ""}${v.why ? `<span class="bad">${esc(v.why)}</span>` : ""}<span>${esc(v.by === "engine" ? "decided by the engine" : "judged by " + v.by)}</span>${ev}</div>` : ""}</div>
      ${shown ? `<div class="evb"><div class="c"><span>$ ${esc(shown.cmd)}</span><i>${shown.kind === "http" ? "status" : "exit"} ${shown.exit}</i></div><pre>${esc(shown.cap ? shown.cap + "\n\n" + shown.out : shown.out)}</pre></div>` : ""}</div>`;
  }).join("");
}
let callSig = "";
function callBox() {
  let sig = "", h = "";
  if (openId === "setup") {
    const { su, asking, left } = setupNow();
    if (asking && left) {
      sig = "setup:" + su.questions.map((q) => q.a).join();
      h = `<div class="call"><h4>Your call · ${left} question${left === 1 ? "" : "s"}</h4>${su.questions.map((q) => `<div class="sq"><p>${esc(q.q)}</p><p class="why">${esc(q.why)}</p>${q.opts.map(([v, t, d]) => `<button type="button" class="opt ${q.a === v ? "on" : ""}" data-q="${q.id}" data-v="${v}"><b>${esc(t)}</b><span>${code(d)}</span></button>`).join("")}</div>`).join("")}<div class="cmd">Setup carries on by itself once both are answered.</div></div>`;
    }
  } else {
    const j = K.job(openId);
    if (j && K.waiting(j) && j.ask) {
      sig = "job:" + j.id;
      h = `<div class="call"><h4>Your call · ${esc(j.ask.why)}</h4><p>${code(j.ask.text)}</p><p class="why">${code(j.ask.detail)}</p>
        <textarea id="ans" placeholder="Type your answer…" aria-label="Your answer"></textarea>
        <div class="row"><button type="button" class="btn primary" data-send>Send answer</button><button type="button" class="btn link" data-sug>Use the suggested answer</button><button type="button" class="btn quiet-b" data-reject>Reject job</button></div>
        <div class="cmd">same as: ${esc(j.ask.cmd)} "…"</div></div>`;
    }
  }
  if (sig !== callSig) { callSig = sig; $("p-call").innerHTML = h; }
}
function panel() {
  if (!openId) return;
  callBox();
  if (openId === "setup") {
    const { su, live, left, asking, proven, doneN } = setupNow();
    $("p-num").textContent = "setup · " + su.repo + " · example";
    $("p-title").textContent = "Project setup";
    $("p-sub").innerHTML = `step ${Math.min(doneN + 1, su.steps.length)} of ${su.steps.length} · ${usd(su.usd)} · ${since(su.started)}`;
    $("p-steps").innerHTML = setupSteps();
    $("p-who").textContent = live ? live.by.replace(" · claude", "") : "";
    $("p-feed").innerHTML = live && live.ev.length ? feed(live.ev) : `<p class="quiet">${asking && left ? "Nothing is running. Setup is waiting for your answers." : proven ? "Finished. Nothing is running." : "Starting…"}</p>`;
    $("p-crit-sec").hidden = true;
    return;
  }
  const j = K.job(openId); if (!j) return closePanel();
  const run = K.cur(j), cs = K.crit(j), pass = cs.filter((c) => c.last && !c.stale && c.last.r === "PASS").length;
  $("p-num").textContent = `${j.id} · ${j.kind} · ${j.risk} risk${j.example ? " · example" : ""}`;
  $("p-title").textContent = j.title;
  $("p-sub").innerHTML = `${K.LABEL[j.stage].toLowerCase()} · round ${j.round} of ${j.limit} · ${usd(j.usd)} · ${j.ended ? dur(K.total(j)) : since(j.started)}`;
  $("p-steps").innerHTML = jobSteps(j);
  $("p-who").textContent = run ? whoOf(run) : "";
  $("p-feed").innerHTML = run ? (run.ev.length ? feed(run.ev) : '<p class="quiet">Starting…</p>') : `<p class="quiet">${K.waiting(j) ? "Nothing is running. This job is waiting for you." : j.stage === "rejected" ? "Closed by you. Nothing is running." : "Finished. Nothing is running."}</p>`;
  $("p-crit-sec").hidden = false;
  $("p-crit-n").textContent = `${pass} of ${cs.length} pass`;
  $("p-crit").innerHTML = criteria(j);
}
function openPanel(id, from) {
  openId = id; openEv = null; callSig = "~"; lastFocus = from || null;
  $("overlay").classList.add("open"); panel(); draw();
  document.querySelector(".p-body").scrollTop = 0;
  document.querySelector(".close").focus({ preventScroll: true });
}
function closePanel() {
  if (!openId) return;
  const id = openId; openId = null; $("overlay").classList.remove("open"); draw();
  document.querySelector(`[data-open="${id}"]`)?.focus({ preventScroll: true });
}
function draw() { counts(); setupRow(); board(); }

// ---- Events --------------------------------------------------------------
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-q],[data-ev],[data-send],[data-sug],[data-reject],[data-close],[data-open],#theme");
  if (!t) return;
  if (t.dataset.q) { K.setupAnswer(t.dataset.q, t.dataset.v); return; }
  if (t.dataset.ev) { openEv = openEv === t.dataset.ev ? null : t.dataset.ev; return panel(); }
  if ("sug" in t.dataset) { const a = $("ans"); a.value = K.job(openId).ask.suggest[0]; a.focus(); return; }
  if ("send" in t.dataset) { const a = $("ans"); if (!a.value.trim()) return a.focus(); return K.answer(openId, a.value.trim()); }
  if ("reject" in t.dataset) return K.reject(openId);
  if ("close" in t.dataset) return closePanel();
  if (t.dataset.open) return openPanel(t.dataset.open, t);
  const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; t.textContent = r.dataset.theme === "dark" ? "light" : "dark";
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return closePanel();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("[data-open]")) { e.preventDefault(); openPanel(e.target.dataset.open, e.target); }
});
K.on((type, p) => {
  if (type === "clock") {
    document.querySelectorAll("[data-t0]").forEach((n) => (n.textContent = dur((Date.now() - +n.dataset.t0) / 1000)));
    return counts();
  }
  if (type === "move" && p.j) moved[p.j.id] = Date.now();
  if (type === "reset") { openEv = null; callSig = "~"; }
  draw(); panel();
});
draw();
</script>
</body>
