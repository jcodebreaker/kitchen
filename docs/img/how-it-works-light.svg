<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 512" width="920" height="512" role="img" aria-label="How Kitchen works: you tell Claude Code what you want and it files a ticket; Kitchen's scheduler (kitchen run) plans waves, starts one agent session per lane and moves each job with its kitchen job verbs; each lane's agent (intake, build, QA, review) writes into the job folder; QA drives your app with Playwright, following and keeping the verify map; before a job merges, a merge check drives the features the merge touches on the merged result; green lands in staging with its Report, and you merge staging onward.">
<defs><marker id="hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5,1.5L8,5L1.5,8.5" fill="none" stroke="#6b6b74" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5,1.5L8,5L1.5,8.5" fill="none" stroke="#d9480f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}.t{font-size:15px;font-weight:600;fill:#18181b}.s{font-size:12.5px;fill:#6b6b74}.m{font-size:12px;fill:#6b6b74;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}.l{font-size:12px;fill:#6b6b74}.la{font-size:12px;fill:#d9480f;font-weight:600}</style>
<rect width="920" height="512" rx="14" fill="#ffffff"/>
<g><rect x="20" y="26" width="196" height="84" rx="12" fill="#f7f7f8" stroke="#dcdce0" stroke-width="1"/>
<text x="36" y="56" class="t">You</text><text x="36" y="77" class="s">say what you want,</text><text x="36" y="94" class="s">in plain words</text></g>
<g><rect x="248" y="26" width="196" height="84" rx="12" fill="#ffffff" stroke="#dcdce0" stroke-width="1"/>
<text x="264" y="56" class="t">Front desk</text><text x="264" y="77" class="s">Claude Code or Codex</text><text x="264" y="94" class="s">files it as a ticket</text></g>
<g><rect x="476" y="26" width="196" height="84" rx="12" fill="#ffffff" stroke="#dcdce0" stroke-width="1"/>
<text x="492" y="56" class="t">Kitchen</text><text x="492" y="77" class="s">kitchen run plans waves,</text><text x="492" y="94" class="s">starts one agent per lane</text></g>
<g><rect x="704" y="26" width="196" height="84" rx="12" fill="#ffffff" stroke="#dcdce0" stroke-width="1"/>
<text x="720" y="56" class="t">Lane agents</text><text x="720" y="77" class="s">a fresh session for each:</text><text x="720" y="94" class="s">intake, build, QA, review</text></g>
<g><rect x="20" y="196" width="196" height="84" rx="12" fill="#ffffff" stroke="#d9480f" stroke-width="1.5"/>
<text x="36" y="226" class="t">Report</text><text x="36" y="247" class="s">what changed and the proof.</text><text x="36" y="264" class="s">Merged into staging.</text></g>
<g><rect x="248" y="196" width="196" height="84" rx="12" fill="#f7f7f8" stroke="#dcdce0" stroke-width="1"/>
<text x="264" y="226" class="t">Your app</text><text x="264" y="247" class="s">the real thing, running</text><text x="264" y="264" class="s">on your machine</text></g>
<g><rect x="476" y="196" width="196" height="84" rx="12" fill="#ffffff" stroke="#dcdce0" stroke-width="1"/>
<text x="492" y="226" class="t">Playwright</text><text x="492" y="247" class="s">starts your app, clicks,</text><text x="492" y="264" class="s">reads, takes screenshots</text></g>
<g><rect x="704" y="196" width="196" height="84" rx="12" fill="#ffffff" stroke="#dcdce0" stroke-width="1"/>
<text x="720" y="226" class="t">Job folder</text><text x="720" y="247" class="m">.kitchen/jobs/&lt;id&gt;/</text><text x="720" y="264" class="s">state and plain evidence</text></g>
<g><rect x="476" y="366" width="196" height="84" rx="12" fill="#ffffff" stroke="#dcdce0" stroke-width="1"/>
<text x="492" y="396" class="t">Verify map</text><text x="492" y="417" class="m">skills/verify-&lt;app&gt;/</text><text x="492" y="434" class="s">one file per feature</text></g>
<g><rect x="704" y="366" width="196" height="84" rx="12" fill="#ffffff" stroke="#dcdce0" stroke-width="1"/>
<text x="720" y="396" class="t">Merge check</text><text x="720" y="417" class="s">drives the touched features</text><text x="720" y="434" class="s">on the merged result</text></g>
<path d="M221,68H242" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hm)"/><path d="M449,68H470" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hm)"/><path d="M677,68H698" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hm)"/>
<path d="M574,116V189" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ha)"/><text x="584" y="157" class="la">QA checks it</text>
<path d="M471,238H450" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ha)"/>
<path d="M677,238H698" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hm)"/>
<path d="M802,116V189" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hm)"/><text x="812" y="157" class="l">one file each</text>
<path d="M574,287V359" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#hm)" marker-end="url(#hm)"/><text x="584" y="327" class="l">QA follows and keeps it</text>
<path d="M802,286V359" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hm)"/><text x="812" y="327" class="l">review passed</text>
<path d="M677,408H698" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hm)"/>
<path d="M802,456V482Q802,490 794,490H126Q118,490 118,482V287" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ha)"/><text x="460" y="506" text-anchor="middle" class="la">green: it lands in staging and the evidence becomes the Report</text>
<path d="M118,190V117" fill="none" stroke="#6b6b74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hm)"/><text x="128" y="157" class="l">you merge staging onward</text>
</svg>
